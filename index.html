<html lang="it">

<title>Asta — assistente fantacalcio Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --surface2:#F6F8F5;
  --ink:#16222B; --muted:#6B7A83; --line:#D7DDD6;
  --petrol:#0F4C5C; --gold:#D99A0B; --gold-deep:#A8700A;
  --P:#E07B39; --D:#2E9E5B; --C:#2F6FD0; --A:#CF3327;
  --ok:#2E9E5B; --warn:#CF3327;
  --r:10px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Instrument Sans',system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:-0.02em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:var(--ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:1120px;margin:0 auto;padding:0 12px 90px}
header.top{
  position:sticky;top:0;z-index:30;background:var(--petrol);color:#EAF2F2;
  margin:0 -12px 12px;padding:10px 14px 0;
}
.top-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;letter-spacing:-0.03em;color:#fff}
.brand em{font-style:normal;color:var(--gold)}
.brand-sub{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#8FB2B8}
.top-stats{margin-left:auto;display:flex;gap:14px}
.tstat{text-align:right;line-height:1.1}
.tstat b{font-family:var(--mono);font-size:17px;display:block;color:#fff}
.tstat span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#8FB2B8}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav.tabs button{
  background:transparent;border:0;color:#8FB2B8;padding:9px 13px;border-radius:8px 8px 0 0;
  font-weight:600;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent
}
nav.tabs button[data-on="1"]{background:var(--bg);color:var(--ink);border-bottom-color:var(--gold)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card > h2{font-size:15px;margin-bottom:2px}
.hint{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.g4{grid-template-columns:repeat(2,1fr)}}

label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px;font-weight:600}
input.f,select.f{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
input.f:focus,select.f:focus{outline:2px solid var(--petrol);outline-offset:1px}
input.f.num{font-family:var(--mono)}

.btn{background:var(--petrol);color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:600}
.btn.ghost{background:transparent;color:var(--petrol);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2A1E00}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tag{font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none}
.tag.P{background:var(--P)}.tag.D{background:var(--D)}.tag.C{background:var(--C)}.tag.A{background:var(--A)}

/* ---------- table ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
th.s{cursor:pointer;user-select:none}
td{padding:6px 8px;border-bottom:1px solid #EDF0EB;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr[data-gone="1"] td{opacity:.38}
tr[data-mine="1"]{background:#F0F8F2}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pname{font-weight:600}
.pteam{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.price{font-family:var(--mono);font-weight:600;color:var(--gold-deep);text-align:right}
.cellinput{width:52px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;text-align:right;font-family:var(--mono);font-size:12.5px;background:var(--surface2)}
.star{background:none;border:0;font-size:15px;line-height:1;padding:2px 4px;color:#C9D0C8}
.star[data-on="1"]{color:var(--gold)}

.fas{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--surface2);border:1px solid var(--line)}
.fas[data-t="1"]{background:#1B3A44;color:#fff;border-color:#1B3A44}
.fas[data-t="2"]{background:#3E6B76;color:#fff;border-color:#3E6B76}
.fas[data-t="3"]{background:#9FBAC0;color:#12232A;border-color:#9FBAC0}
.fas[data-t="4"]{background:#DDE5E4;color:#3F5158;border-color:#D2DBDA}

/* ---------- signature: max bid ---------- */
.bidbox{background:var(--petrol);color:#EAF2F2;border-radius:var(--r);padding:16px;margin-bottom:12px}
.bidhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bidname{font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;color:#fff;letter-spacing:-.02em}
.bidmeta{font-size:11.5px;color:#8FB2B8;text-transform:uppercase;letter-spacing:.09em}
.bignum{font-family:var(--mono);font-weight:600;font-size:60px;line-height:.95;color:var(--gold);letter-spacing:-.03em}
@media(max-width:420px){.bignum{font-size:48px}}
.bignum small{font-size:16px;color:#8FB2B8;font-weight:400;letter-spacing:0}
.bidgrid{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid #2C6070}
.bidgrid div span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#8FB2B8}
.bidgrid div b{font-family:var(--mono);font-size:16px;color:#fff;font-weight:500}
.gauge{height:6px;background:#2C6070;border-radius:3px;margin-top:12px;position:relative;overflow:hidden}
.gauge i{position:absolute;top:0;bottom:0;background:var(--gold);border-radius:3px;transition:all .35s ease}
.gaugelab{display:flex;justify-content:space-between;font-size:10.5px;color:#8FB2B8;margin-top:5px;letter-spacing:.06em;text-transform:uppercase}

/* depletion strip */
.strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.strip i{width:11px;height:16px;border-radius:2px;background:var(--petrol);opacity:.85}
.strip i[data-gone="1"]{background:transparent;border:1px solid var(--line)}
.striprow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line)}
.striprow:last-child{border-bottom:0}
.striprow > b{font-family:var(--mono);font-size:12px;width:56px;color:var(--muted);flex:none}

.teamchip{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface2);min-width:104px}
.teamchip b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.teamchip span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.teamchip[data-me="1"]{border-color:var(--petrol);background:#E8F1F0}
.teamchip[data-low="1"] span{color:var(--warn)}

.bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--petrol)}
.bar i[data-over="1"]{background:var(--warn)}

.cons{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  border:1px solid;border-radius:20px;padding:1px 7px;white-space:nowrap}
.brow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid #EEF1ED;padding:8px 2px}
.brow:last-child{border-bottom:0}
.brow:hover,.brow:focus{background:var(--surface2)}
.brow[data-gone="1"]{opacity:.35}
.brow .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rolebar{display:flex;gap:6px;margin-bottom:8px}
.rolebar button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:8px;
  padding:7px 0;font-weight:600;font-size:13px;color:var(--muted)}
.rolebar button[data-on="1"]{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.sug{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:0 0 8px 8px;
  max-height:250px;overflow-y:auto;z-index:20;box-shadow:0 8px 20px rgba(20,40,50,.13)}
.sug button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-bottom:1px solid #EEF1ED}
.sug button:hover,.sug button:focus{background:var(--surface2)}
.banner{background:#FDF3E0;border:1px solid #EBD5A6;border-radius:var(--r);padding:9px 12px;font-size:12.5px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:26px 14px;font-size:13.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const {useState,useEffect,useMemo,useRef} = React;

/* ============================== STORAGE ============================== */
const KEY='fantasta_v1';
const store={
  async load(){
    try{ if(window.storage){const r=await window.storage.get(KEY); return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; }
  },
  async save(d){
    const s=JSON.stringify(d);
    try{ if(window.storage){ await window.storage.set(KEY,s); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};

Meister|Pisa|A|14|14|27|5.8|6.4
Vardy|Cremonese|A|17|18|25|5.9|6.7`;

const ROLES=['P','D','C','A'];
const ROLENAME={P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
const uid=()=>Math.random().toString(36).slice(2,9);

function parseDemo(){
  return DEMO.trim().split('\n').map(l=>{
    const [nome,squadra,ruolo,qt,fvm,pv,mv,fm]=l.split('|');
    return {id:uid(),nome,squadra,ruolo,qt:+qt,fvm:+fvm,pv:+pv,mv:+mv,fm:+fm,
            rig:false,tgt:0,ovrFm:null,ovrPres:null,owner:null,paid:null};
  });
}

const DEFCFG={
  teams:['Io','Squadra 2','Squadra 3','Squadra 4','Squadra 5','Squadra 6','Squadra 7','Squadra 8'],
  budget:500, slots:{P:3,D:8,C:8,A:6}, starters:{P:1,D:4,C:4,A:3}, rigBonus:0.4,
  mod:true, modK:1, gamma:0.85, tetto:45, alloc:{P:9,D:26,C:25,A:40}
};

/* ============================== MODELLO ============================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FMR={P:[5.0,6.0],D:[5.6,6.7],C:[5.8,7.4],A:[5.9,8.1]};   // fantamedia attesa: fondo → top del ruolo
const PRR={P:[24,34],D:[22,33],C:[22,33],A:[21,33]};            // presenze attese: fondo → top
const MVR={P:[5.65,6.30],D:[5.70,6.35],C:[5.80,6.45],A:[5.75,6.40]}; // media voto attesa (serve al modificatore)

function project(players,cfg){
  const out=players.map(p=>({...p}));
  ROLES.forEach(R=>{
    const g=out.filter(p=>p.ruolo===R);
    if(!g.length) return;
    const vals=g.map(p=>p.fvm||p.qt||1);
    const mx=Math.max(...vals), mn=Math.min(...vals);
    g.forEach(p=>{
      const v=p.fvm||p.qt||1;
      const pct=mx>mn?Math.pow((v-mn)/(mx-mn),0.75):0.5;
      const mFm=FMR[R][0]+pct*(FMR[R][1]-FMR[R][0]);
      const mPr=PRR[R][0]+pct*(PRR[R][1]-PRR[R][0]);
      const mMv=MVR[R][0]+pct*(MVR[R][1]-MVR[R][0]);
      const hasSt=p.pv>0&&p.fm>0;
      p.baseFm = hasSt ? 0.62*p.fm+0.38*mFm : mFm;
      p.baseMv = hasSt&&p.mv>0 ? 0.65*p.mv+0.35*mMv : mMv;
      p.basePres = Math.round(hasSt ? 0.55*clamp(p.pv,0,38)+0.45*mPr : mPr);
      p.fmA = p.ovrFm!=null?p.ovrFm:+p.baseFm.toFixed(2);
      p.mvA = p.ovrMv!=null?p.ovrMv:+p.baseMv.toFixed(2);
      p.presA = p.ovrPres!=null?p.ovrPres:p.basePres;
      p.modPts = 0;
      p.puri = (p.fmA + (p.rig?cfg.rigBonus:0)) * p.presA;
      p.fp = p.puri;
    });
  });

  // --- modificatore di difesa: quanto sposta la media del blocco P + 3 D ---
  if(cfg.mod){
    ['P','D'].forEach(R=>{
      const g=out.filter(p=>p.ruolo===R).sort((a,b)=>b.mvA-a.mvA);
      if(!g.length) return;
      const idx=Math.min(g.length-1, cfg.teams.length*cfg.starters[R]);
      const rep=g[idx].mvA;
      g.forEach(p=>{
        p.modPts = Math.max(0,(p.mvA-rep))*cfg.modK*p.presA;
        p.fp = p.puri + p.modPts;
      });
    });
  }
  return out;
}

/* miglior blocco difensivo per squadra di Serie A: portiere + 3 difensori */
function blocchi(ps,cfg){
  const teams={};
  ps.filter(p=>p.ruolo==='P'||p.ruolo==='D').forEach(p=>{
    (teams[p.squadra]=teams[p.squadra]||{P:[],D:[]})[p.ruolo].push(p);
  });
  return Object.entries(teams).map(([sq,g])=>{
    const P=g.P.sort((a,b)=>b.mvA-a.mvA)[0];
    const D=g.D.sort((a,b)=>b.mvA-a.mvA).slice(0,3);
    if(!P||D.length<3) return null;
    const men=[P,...D];
    const media=men.reduce((s,p)=>s+p.mvA,0)/4;
    const costo=men.reduce((s,p)=>s+p.prezzo,0);
    const liberi=men.filter(p=>!p.owner).length;
    return {sq,men,media:+media.toFixed(3),costo,liberi};
  }).filter(Boolean).sort((a,b)=>b.media-a.media);
}

function valuate(players,cfg){
  const nT=cfg.teams.length;
  const slotTot=ROLES.reduce((s,R)=>s+cfg.slots[R],0);
  const pool=nT*cfg.budget, seats=nT*slotTot;
  const surplusPool=Math.max(1,pool-seats);
  const ps=project(players,cfg);

  ROLES.forEach(R=>{
    const g=ps.filter(p=>p.ruolo===R).sort((a,b)=>b.fp-a.fp);
    const idx=Math.min(g.length-1, nT*cfg.starters[R]);
    const repl=g.length?g[idx].fp:0;
    g.forEach((p,i)=>{p.rank=i+1; p.repl=repl; p.vor=Math.max(0,p.fp-repl);});
  });

  const G=cfg.gamma||1;
  ps.forEach(p=>{p.w=Math.pow(p.vor,G);});
  const sumW=ps.reduce((s,p)=>s+p.w,0)||1;
  ps.forEach(p=>{p.prezzo=Math.max(1,Math.round(1+p.w/sumW*surplusPool));});

  // --- mercato live: inflazione su ciò che resta ---
  const taken=ps.filter(p=>p.owner);
  const spent=taken.reduce((s,p)=>s+(p.paid||0),0);
  const remCred=pool-spent, remSeats=seats-taken.length;
  const remSurplus=Math.max(0,remCred-remSeats);
  const remW=ps.filter(p=>!p.owner).reduce((s,p)=>s+p.w,0)||1;
  ps.forEach(p=>{p.live=p.owner?p.paid:Math.max(1,Math.round(1+p.w/remW*remSurplus));});
  const infl=(remSurplus/remW)/(surplusPool/sumW);

  // --- fasce: taglio sui 4 salti di prezzo più grandi, per ruolo ---
  ROLES.forEach(R=>{
    const g=ps.filter(p=>p.ruolo===R&&p.prezzo>=3).sort((a,b)=>b.prezzo-a.prezzo);
    const gaps=g.slice(0,-1).map((p,i)=>({i,d:p.prezzo-g[i+1].prezzo}))
                 .sort((a,b)=>b.d-a.d).slice(0,3).map(x=>x.i).sort((a,b)=>a-b);
    let t=1; g.forEach((p,i)=>{p.fascia=t; if(gaps.includes(i)) t++;});
    ps.filter(p=>p.ruolo===R&&p.prezzo<3).forEach(p=>{p.fascia=5;});
  });

  const teamState=cfg.teams.map(name=>{
    const own=ps.filter(p=>p.owner===name);
    const sp=own.reduce((s,p)=>s+(p.paid||0),0);
    const byR={}; ROLES.forEach(R=>byR[R]=own.filter(p=>p.ruolo===R).length);
    const left=slotTot-own.length;
    return {name,own,spent:sp,credits:cfg.budget-sp,slotsLeft:left,byR,
            maxBid:Math.max(0,cfg.budget-sp-Math.max(0,left-1))};
  });

  return {ps,pool,seats,spent,remCred,remSeats,infl,teamState,slotTot,surplusPool,sumVOR:sumW};
}

/* ============================== SIMULATORE STRATEGIE ============================== */
const PRESET={
  'Blocco difensivo':{P:9,D:26,C:25,A:40},
  'Equilibrata':     {P:6,D:15,C:27,A:52},
  'Tripletta attacco':{P:5,D:10,C:22,A:63},
  'Centrocampo bonus':{P:6,D:12,C:40,A:42},
  'Difesa low cost': {P:5,D:8,C:30,A:57}
};

/* Zaino: la MIGLIORE combinazione di nTit giocatori entro il budget,
   non la più avida. Il tetto impedisce di bruciare il reparto su un nome solo. */
function bestRoster(pool,nTit,budget,tetto){
  const items=pool.filter(p=>p.prezzo<=tetto).slice(0,90);
  if(!items.length||nTit<=0) return [];
  const B=Math.max(nTit,Math.round(budget));
  const NEG=-1e9;
  const dp=[],ch=[],pb=[];
  for(let k=0;k<=nTit;k++){
    dp.push(new Float64Array(B+1).fill(NEG));
    ch.push(new Int32Array(B+1).fill(-1));
    pb.push(new Int32Array(B+1).fill(-1));
  }
  dp[0].fill(0);
  items.forEach((p,i)=>{
    const c=Math.max(1,p.prezzo);
    for(let k=nTit;k>=1;k--){
      for(let b=B;b>=c;b--){
        const prev=dp[k-1][b-c];
        if(prev>NEG/2&&prev+p.fp>dp[k][b]){
          dp[k][b]=prev+p.fp; ch[k][b]=i; pb[k][b]=b-c;
        }
      }
    }
  });
  let bb=-1,best=NEG;
  for(let b=0;b<=B;b++) if(dp[nTit][b]>best){best=dp[nTit][b];bb=b;}
  if(bb<0) return [];
  const out=[];
  let k=nTit,b=bb;
  while(k>0&&ch[k][b]>=0){ out.push(items[ch[k][b]]); const nb=pb[k][b]; k--; b=nb; }
  return out.sort((a,b)=>b.fp-a.fp);
}

function simula(ps,cfg,alloc){
  const out={roles:{},pts:0,spent:0};
  ROLES.forEach(R=>{
    const nSlot=cfg.slots[R], nTit=Math.min(cfg.starters[R],nSlot);
    const bench=nSlot-nTit;
    const roleBud=Math.round(cfg.budget*alloc[R]/100);
    const titBud=Math.max(nTit, roleBud-bench);
    const tetto=Math.max(2,Math.round(titBud*(cfg.tetto||100)/100));
    const pool=ps.filter(p=>p.ruolo===R&&!p.owner).sort((a,b)=>b.fp-a.fp);
    let tit=bestRoster(pool,nTit,titBud,tetto);
    if(tit.length<nTit) tit=bestRoster(pool,nTit,titBud,titBud); // se il tetto è troppo stretto
    const sp=tit.reduce((s,p)=>s+p.prezzo,0);
    const rest=pool.filter(p=>!tit.includes(p)).sort((a,b)=>a.prezzo-b.prezzo||b.fp-a.fp);
    const pan=rest.slice(0,bench);
    const spPan=pan.reduce((s,p)=>s+p.prezzo,0);
    out.roles[R]={tit,pan,spesa:sp+spPan,budget:roleBud,pts:tit.reduce((s,p)=>s+p.fp,0)};
    out.pts+=out.roles[R].pts; out.spent+=sp+spPan;
  });
  return out;
}

/* ============================== IMPORT XLSX ============================== */
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
function readSheet(ab){
  const wb=XLSX.read(ab,{type:'array'});
  const sh=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true});
  let h=-1;
  for(let i=0;i<Math.min(8,rows.length);i++){
    if((rows[i]||[]).some(c=>norm(c)==='nome')){h=i;break;}
  }
  if(h<0) throw new Error('Intestazione non trovata: serve una colonna "Nome".');
  const head=rows[h].map(norm);
  const col=n=>head.indexOf(n);
  const ci={id:col('id'),r:col('r'),nome:col('nome'),squadra:col('squadra'),
            qt:head.findIndex(x=>x==='qta'||x==='qtaa'||x==='quotazione'),
            fvm:head.findIndex(x=>x==='fvm'),pv:col('pv'),mv:col('mv'),fm:col('fm')};
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[]; const nome=r[ci.nome];
    if(!nome||typeof nome!=='string') continue;
    const ruolo=String(r[ci.r]||'').trim().toUpperCase().charAt(0);
    if(!ROLES.includes(ruolo)) continue;
    out.push({
      key:ci.id>=0&&r[ci.id]?String(r[ci.id]):norm(nome)+norm(r[ci.squadra]),
      nome:nome.trim(), squadra:String(r[ci.squadra]||'').trim(), ruolo,
      qt:+r[ci.qt]||0, fvm:+r[ci.fvm]||0, pv:+r[ci.pv]||0, mv:+r[ci.mv]||0, fm:+r[ci.fm]||0
    });
  }
  return out;
}

/* Verdetto su un giocatore, dato dove sei con budget e slot */
function consiglio(p,ctx){
  const {myT,cfg,piano}=ctx;
  if(p.owner) return {l:p.owner===cfg.teams[0]?'Mio':'Preso',c:'#9AA7AE'};
  if(myT.byR[p.ruolo]>=cfg.slots[p.ruolo]) return {l:'Ruolo pieno',c:'#9AA7AE'};
  if(p.live>myT.maxBid)                    return {l:'Fuori budget',c:'#CF3327'};
  if(p.tgt)                                return {l:'Obiettivo',c:'#D99A0B'};
  if(piano.has(p.id))                      return {l:'Nel piano',c:'#D99A0B'};
  if(p.vor<=0)                             return {l:'Da 1 credito',c:'#9AA7AE'};
  if(p.rank<=cfg.teams.length*cfg.starters[p.ruolo]) return {l:'Titolare',c:'#2E9E5B'};
  return {l:'Riserva',c:'#2F6FD0'};
}
const Cons=({p,ctx})=>{
  const c=consiglio(p,ctx);
  return <span className="cons" style={{color:c.c,borderColor:c.c}}>{c.l}</span>;
};

    onChange={e=>onChange(e.target.value===''?'':+e.target.value)}/>;
}

          <div><span>listino base</span><b>{P.prezzo}</b></div>
          <div><span>max tecnico</span><b>{roleFull?'—':maxTech}</b></div>
          <div><span>punti attesi</span><b>{Math.round(P.fp)}</b></div>
          <div><span>sopra il sostituto</span><b>+{Math.round(P.vor)}</b></div>
          {cfg.mod&&P.modPts>0&&<div><span>da modificatore</span><b>+{Math.round(P.modPts)}</b></div>}
        </div>
      </div>

      {roleFull && <div className="banner">Hai già riempito gli slot da {ROLENAME[P.ruolo].toLowerCase()}.</div>}

      <div className="card">
        <div className="grid g2">
          <div><label className="f">Prezzo finale</label>
            <input className="f num" type="number" inputMode="numeric" min="1" value={bid}
              onChange={e=>setBid(e.target.value)} onFocus={e=>e.target.select()}/></div>
          <div><label className="f">Va a</label>
            <select className="f" value={team} onChange={e=>setTeam(e.target.value)}>
              {cfg.teams.map(t=><option key={t}>{t}</option>)}
            </select></div>
        </div>
        {bid!==''&&+bid>P.live&&<p className="hint" style={{color:'var(--warn)',marginTop:8}}>
          {Math.round((+bid/P.live-1)*100)}% sopra il prezzo di mercato — accettabile solo se è un tuo obiettivo dichiarato.</p>}
        <div className="row" style={{marginTop:10}}>
          <button className="btn gold" onClick={assign}>Assegna</button>
          <button className="btn ghost" onClick={()=>{setSel(null);setQ('');setBid('');}}>Annulla</button>
        </div>
      </div>
    </>}

    <div className="card">
      <h2>Consigliati per te adesso</h2>
      <p className="hint">I migliori che ti servono davvero: reparti ancora scoperti, alla tua portata, ordinati per punti per credito.</p>
      {consigliati.map(p=><button key={p.id} className="brow" onClick={()=>pick(p)}>
        <Tag r={p.ruolo}/>
        <span className="g"><b>{p.nome}</b> <span className="pteam">{p.squadra}</span></span>
        <Fascia f={p.fascia}/>
        <span className="price" style={{minWidth:34}}>{p.live}</span>
      </button>)}
      {!consigliati.length&&<div className="empty">Nessun consiglio: o hai i reparti pieni, o non hai crediti per i titolari rimasti.</div>}
    </div>

    <div className="card">
      <h2>Tabellone</h2>
      <div className="rolebar">
        {ROLES.map(R=><button key={R} data-on={board===R?'1':'0'} onClick={()=>setBoard(R)}>
          {R} <span style={{fontWeight:400}}>{M.ps.filter(p=>p.ruolo===R&&!p.owner).length}</span></button>)}
      </div>
      <div className="row" style={{marginBottom:6}}>
        <button className={'btn sm '+(ord==='cons'?'':'ghost')} onClick={()=>setOrd('cons')}>Prezzo consigliato</button>
        <button className={'btn sm '+(ord==='qt'?'':'ghost')} onClick={()=>setOrd('qt')}>Quotazione listino</button>
      </div>
      <div style={{maxHeight:460,overflowY:'auto'}}>
        {lista.map(p=><button key={p.id} className="brow" onClick={()=>pick(p)}>
          <Tag r={p.ruolo}/>
          <span className="g"><b>{p.nome}</b> <span className="pteam">{p.squadra}</span></span>
          <Cons p={p} ctx={ctx}/>
          <Fascia f={p.fascia}/>
          <span className="price" style={{minWidth:34}}>{ord==='qt'?p.qt:p.live}</span>
        </button>)}
        {!lista.length&&<div className="empty">Nessun {ROLENAME[board].toLowerCase()} ancora libero.</div>}
      </div>
    </div>

    <div className="card">
      <h2>Chi resta, per fascia</h2>
      <p className="hint">Ogni blocco è un giocatore ancora libero. Quando una fascia si svuota, il prezzo di quella sotto esplode.</p>
      {ROLES.map(R=>{
        const g=M.ps.filter(p=>p.ruolo===R&&p.fascia<5).sort((a,b)=>a.fascia-b.fascia||b.prezzo-a.prezzo);
        return <div key={R} className="striprow">
          <b><Tag r={R}/> {g.filter(p=>!p.owner).length}/{g.length}</b>
          <div className="strip">{g.map(p=><i key={p.id} data-gone={p.owner?'1':'0'} title={p.nome+' · F'+p.fascia}/>)}</div>
        </div>;
      })}
    </div>

    <div className="card">
      <h2>Crediti degli avversari</h2>
      <p className="hint">Chi ha ancora budget può rilanciarti. Chi è a secco no.</p>
      <div className="row">
        {M.teamState.map(t=><div key={t.name} className="teamchip" data-me={t.name===me?'1':'0'}
            data-low={t.credits<=t.slotsLeft+3?'1':'0'}>
          <b>{t.name}</b>
          <span>{t.credits} cr · {t.slotsLeft} slot · max {t.maxBid}</span>
        </div>)}
      </div>
    </div>

    <div className="card">
      <h2>Ultimi acquisti</h2>
      {M.ps.filter(p=>p.owner).slice(-12).reverse().map(p=>
        <div key={p.id} className="row" style={{justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #EEF1ED'}}>
          <span><Tag r={p.ruolo}/> <b>{p.nome}</b> <span className="pteam">{p.owner}</span></span>
          <span className="row">
            <span className="num" style={{color:p.paid>p.prezzo?'var(--warn)':'var(--ok)'}}>{p.paid} <small style={{color:'var(--muted)'}}>vs {p.prezzo}</small></span>
            <button className="btn ghost sm" onClick={()=>upd(p.id,{owner:null,paid:null})}>annulla</button>
          </span>
        </div>)}
      {!M.ps.some(p=>p.owner)&&<div className="empty">Nessun giocatore assegnato. Il mercato parte da qui.</div>}
    </div>
  </>;
}

/* ============================== TAB: STRATEGIA ============================== */
function Strategia({M,cfg,setCfg,upd}){
  const alloc=cfg.alloc;
  const somma=ROLES.reduce((s,R)=>s+alloc[R],0);
  const set=(R,v)=>setCfg({...cfg,alloc:{...alloc,[R]:clamp(v||0,0,100)}});

  const norm={}; ROLES.forEach(R=>norm[R]=somma?alloc[R]/somma*100:25);
  const mia=useMemo(()=>simula(M.ps,cfg,norm),[M.ps,cfg,somma,alloc.P,alloc.D,alloc.C,alloc.A]);
  const conf=useMemo(()=>Object.entries(PRESET).map(([k,a])=>({k,a,r:simula(M.ps,cfg,a)}))
                       .sort((x,y)=>y.r.pts-x.r.pts),[M.ps,cfg]);
  const best=conf[0];
  const blk=useMemo(()=>cfg.mod?blocchi(M.ps,cfg).slice(0,8):[],[M.ps,cfg]);

  return <>
    <div className="card">
      <h2>Ripartizione del budget</h2>
      <p className="hint">Sposta i crediti tra i reparti e guarda i punti attesi dei titolari muoversi.
        {cfg.mod && <b> Modificatore attivo: difesa e porta valgono molto più del normale.</b>}</p>
      <div className="grid g4">
        {ROLES.map(R=><Field key={R} label={ROLENAME[R]+' %'}>
          <Num value={alloc[R]} onChange={v=>set(R,v)} min={0}/></Field>)}
      </div>
      <p className="hint" style={{marginTop:8,color:somma===100?'var(--muted)':'var(--warn)'}}>
        Totale {somma}%{somma!==100&&' — normalizzo io le percentuali, ma meglio sistemarle.'}</p>
      <div className="row" style={{marginTop:6}}>
        {Object.keys(PRESET).map(k=><button key={k} className="btn ghost sm"
          onClick={()=>setCfg({...cfg,alloc:PRESET[k]})}>{k}</button>)}
      </div>
      <div className="grid g2" style={{marginTop:12}}>
        <Field label="Tetto per giocatore (% del reparto)">
          <Num value={cfg.tetto} onChange={v=>setCfg({...cfg,tetto:clamp(v||10,10,100)})}/></Field>
        <Field label="Concentrazione prezzi">
          <Num value={cfg.gamma} step={0.05} onChange={v=>setCfg({...cfg,gamma:clamp(v||0.5,0.5,1.3)})}/></Field>
      </div>
      <p className="hint" style={{marginTop:8,marginBottom:0}}>
        Il <b>tetto</b> impedisce al piano di bruciare un reparto su un nome solo: al 45% nessun titolare può costare
        più di quasi metà del suo reparto. La <b>concentrazione</b> sotto 1 appiattisce i prezzi verso il centro
        (i top costano meno, le fasce medie di più); sopra 1 li polarizza. Alzala se nella tua lega i big vanno alle stelle.</p>
    </div>

    <div className="bidbox">
      <div className="bidmeta">punti attesi dai titolari con questa ripartizione</div>
      <div className="bignum">{Math.round(mia.pts)}<small> su {cfg.budget} crediti</small></div>
      <div className="bidgrid">
        {ROLES.map(R=><div key={R}><span>{R} · {Math.round(norm[R])}%</span>
          <b>{Math.round(mia.roles[R].pts)}</b></div>)}
        <div><span>vs {best.k}</span><b style={{color:mia.pts>=best.r.pts?'var(--gold)':'#fff'}}>
          {mia.pts>=best.r.pts?'+':''}{Math.round(mia.pts-best.r.pts)}</b></div>
      </div>
    </div>

    <div className="card">
      <h2>Strategie a confronto</h2>
      <p className="hint">Stessa lega, stessi prezzi, ripartizioni diverse. La differenza è in punti a fine stagione.</p>
      <div className="tw" style={{border:0}}>
        <table><thead><tr><th>Strategia</th><th>P</th><th>D</th><th>C</th><th>A</th><th>Punti</th><th>Δ</th></tr></thead>
        <tbody>{conf.map(c=><tr key={c.k}>
          <td><b>{c.k}</b></td>
          {ROLES.map(R=><td key={R} className="n" style={{color:'var(--muted)'}}>{c.a[R]}</td>)}
          <td className="price">{Math.round(c.r.pts)}</td>
          <td className="n" style={{color:c===best?'var(--ok)':'var(--muted)'}}>
            {c===best?'migliore':Math.round(c.r.pts-best.r.pts)}</td>
        </tr>)}</tbody></table>
      </div>
      <p className="hint" style={{marginTop:9,marginBottom:0}}>Il simulatore compra ai prezzi del modello, senza aste al rialzo:
        serve a scegliere <i>dove</i> concentrare i crediti, non a promettere quella rosa.</p>
    </div>

    {cfg.mod && <div className="card">
      <h2>Blocchi difensivi</h2>
      <p className="hint">Portiere + 3 difensori della stessa squadra: media voto attesa e costo a listino.
        Prendere il blocco intero significa che ogni clean sheet ti conta quattro volte.</p>
      <div className="tw" style={{border:0}}>
        <table><thead><tr><th>Squadra</th><th>Media</th><th>Costo</th><th>Liberi</th><th>Uomini</th></tr></thead>
        <tbody>{blk.map(b=><tr key={b.sq} data-gone={b.liberi<4?'1':'0'}>
          <td><b>{b.sq}</b></td>
          <td className="price">{b.media.toFixed(2)}</td>
          <td className="n">{b.costo}</td>
          <td className="n">{b.liberi}/4</td>
          <td style={{fontSize:12,color:'var(--muted)',whiteSpace:'normal'}}>{b.men.map(p=>p.nome).join(', ')}</td>
        </tr>)}</tbody></table>
      </div>
    </div>}

    <div className="card">
      <h2>La rosa che comprerebbe</h2>
      {ROLES.map(R=>{
        const r=mia.roles[R];
        return <div key={R} style={{marginBottom:12}}>
          <div className="row" style={{justifyContent:'space-between',marginBottom:4}}>
            <b><Tag r={R}/> {ROLENAME[R]}</b>
            <span className="num" style={{color:'var(--muted)'}}>{r.spesa} cr · {Math.round(r.pts)} pt</span>
          </div>
          {r.tit.map(p=><div key={p.id} className="row" style={{justifyContent:'space-between',padding:'3px 0'}}>
            <span>{p.nome} <span className="pteam">{p.squadra}</span></span>
            <span className="row">
              <span className="price">{p.prezzo}</span>
              <button className="star" data-on={p.tgt?'1':'0'} onClick={()=>upd(p.id,{tgt:p.tgt?0:1})}>★</button>
            </span>
          </div>)}
          {r.pan.length>0&&<div className="hint" style={{margin:'2px 0 0'}}>
            panchina a 1 credito: {r.pan.map(p=>p.nome).join(', ')}</div>}
        </div>;
      })}
      <p className="hint" style={{marginBottom:0}}>Tocca ★ per portarti questi nomi tra gli obiettivi dell'asta.</p>
    </div>
  </>;
}

/* ============================== TAB: LISTONE ============================== */
function Listone({M,cfg,upd}){
  const [role,setRole]=useState('A');
  const [sort,setSort]=useState('prezzo');
  const [dir,setDir]=useState(-1);
  const [hideGone,setHideGone]=useState(false);
  const [onlyTgt,setOnlyTgt]=useState(false);
  const [q,setQ]=useState('');

  let rows=M.ps.filter(p=>p.ruolo===role);
  if(hideGone) rows=rows.filter(p=>!p.owner);
  if(onlyTgt) rows=rows.filter(p=>p.tgt>0);
  if(q) rows=rows.filter(p=>p.nome.toLowerCase().includes(q.toLowerCase()));
  rows=[...rows].sort((a,b)=>{
    const va=a[sort],vb=b[sort];
    return (typeof va==='string'?va.localeCompare(vb):va-vb)*dir;
  });

  const th=(k,l)=><th className="s" onClick={()=>{sort===k?setDir(-dir):(setSort(k),setDir(-1));}}>
    {l}{sort===k?(dir<0?' ▾':' ▴'):''}</th>;

  return <>
    <div className="card">
      <div className="row" style={{marginBottom:10}}>
        {ROLES.map(R=><button key={R} className={'btn '+(role===R?'':'ghost')} onClick={()=>setRole(R)}>
          {ROLENAME[R]}</button>)}
      </div>
      <div className="row">
        <input className="f" style={{flex:'1 1 160px',width:'auto'}} placeholder="Cerca…" value={q} onChange={e=>setQ(e.target.value)}/>
        <button className={'btn sm '+(hideGone?'':'ghost')} onClick={()=>setHideGone(v=>!v)}>Solo liberi</button>
        <button className={'btn sm '+(onlyTgt?'':'ghost')} onClick={()=>setOnlyTgt(v=>!v)}>★ Obiettivi</button>
      </div>
      <p className="hint" style={{marginTop:9,marginBottom:0}}>
        <b>Prezzo</b> = quanto vale davvero nella tua lega. <b>FM</b> e <b>Pres</b> sono modificabili:
        cambia la proiezione e tutti i prezzi si riequilibrano. <b>R</b> = rigorista (+{cfg.rigBonus} di fantamedia).
      </p>
    </div>

    <div className="tw">
      <table>
        <thead><tr>
          <th>★</th><th>Giocatore</th>{th('fascia','F')}{th('prezzo','Prezzo')}{th('live','Ora')}
          {th('fp','Punti')}{th('vor','+Sost.')}<th>FM</th>
          {cfg.mod&&(role==='P'||role==='D')&&<th>MV</th>}
          <th>Pres</th><th>R</th>{th('qt','Qt.')}<th>Preso da</th>
        </tr></thead>
        <tbody>
          {rows.map(p=><tr key={p.id} data-gone={p.owner?'1':'0'} data-mine={p.owner===cfg.teams[0]?'1':'0'}>
            <td><button className="star" data-on={p.tgt?'1':'0'} onClick={()=>upd(p.id,{tgt:p.tgt?0:1})}>★</button></td>
            <td><span className="pname">{p.nome}</span> <span className="pteam">{p.squadra}</span></td>
            <td><Fascia f={p.fascia}/></td>
            <td className="price">{p.prezzo}</td>
            <td className="n" style={{color:p.live>p.prezzo?'var(--warn)':'var(--ok)'}}>{p.live}</td>
            <td className="n">{Math.round(p.fp)}</td>
            <td className="n">{Math.round(p.vor)}</td>
            <td className="n"><input className="cellinput" type="number" step="0.05" value={p.fmA}
                onChange={e=>upd(p.id,{ovrFm:e.target.value===''?null:+e.target.value})}/></td>
            {cfg.mod&&(role==='P'||role==='D')&&<td className="n">
              <input className="cellinput" type="number" step="0.05" value={p.mvA}
                onChange={e=>upd(p.id,{ovrMv:e.target.value===''?null:+e.target.value})}/></td>}
            <td className="n"><input className="cellinput" type="number" step="1" value={p.presA}
                onChange={e=>upd(p.id,{ovrPres:e.target.value===''?null:+e.target.value})}/></td>
            <td><input type="checkbox" checked={p.rig} onChange={e=>upd(p.id,{rig:e.target.checked})}/></td>
            <td className="n" style={{color:'var(--muted)'}}>{p.qt}</td>
            <td style={{fontSize:12,color:'var(--muted)'}}>{p.owner?`${p.owner} · ${p.paid}`:'—'}</td>
          </tr>)}
        </tbody>
      </table>
      {!rows.length&&<div className="empty">Nessun giocatore con questi filtri.</div>}
    </div>
  </>;
}

/* ============================== TAB: ROSA ============================== */
function Rosa({M,cfg,me,upd}){
  const t=M.teamState.find(x=>x.name===me);
  const nT=cfg.teams.length;

  // allocazione consigliata: quota del budget che il modello assegna ai titolari di ogni ruolo
  const alloc={}; let tot=0;
  ROLES.forEach(R=>{
    const g=M.ps.filter(p=>p.ruolo===R).sort((a,b)=>b.prezzo-a.prezzo).slice(0,nT*cfg.starters[R]);
    alloc[R]=g.reduce((s,p)=>s+p.prezzo,0)/nT; tot+=alloc[R];
  });
  const scale=(cfg.budget-(M.slotTot-ROLES.reduce((s,R)=>s+cfg.starters[R],0)))/ (tot||1);
  ROLES.forEach(R=>alloc[R]=Math.round(alloc[R]*scale));

  const mine=t.own;
  const spentR={}; ROLES.forEach(R=>spentR[R]=mine.filter(p=>p.ruolo===R).reduce((s,p)=>s+p.paid,0));
  const ptsTot=mine.reduce((s,p)=>s+p.fp,0);

  return <>
    <div className="card">
      <h2>Budget per ruolo</h2>
      <p className="hint">La barra grigia è quanto il modello ti consiglia di spendere per quel reparto. Rosso = hai sforato.</p>
      {ROLES.map(R=>{
        const sp=spentR[R], target=alloc[R]||1;
        return <div key={R} style={{marginBottom:11}}>
          <div className="row" style={{justifyContent:'space-between',fontSize:13,marginBottom:4}}>
            <span><Tag r={R}/> {ROLENAME[R]} <span className="pteam">{t.byR[R]}/{cfg.slots[R]}</span></span>
            <span className="num">{sp} <span style={{color:'var(--muted)'}}>/ {target}</span></span>
          </div>
          <div className="bar"><i style={{width:clamp(sp/target*100,0,100)+'%'}} data-over={sp>target?'1':'0'}/></div>
        </div>;
      })}
      <div className="row" style={{justifyContent:'space-between',borderTop:'1px solid var(--line)',paddingTop:9,marginTop:4}}>
        <b>Totale</b><b className="num">{t.spent} / {cfg.budget}</b>
      </div>
    </div>

    <div className="card">
      <h2>Rosa</h2>
      <p className="hint">Punti attesi stagionali della rosa: <b className="num">{Math.round(ptsTot)}</b></p>
      {ROLES.map(R=>{
        const g=mine.filter(p=>p.ruolo===R).sort((a,b)=>b.fp-a.fp);
        if(!g.length) return null;
        return <div key={R} style={{marginBottom:8}}>
          {g.map(p=><div key={p.id} className="row" style={{justifyContent:'space-between',padding:'4px 0'}}>
            <span><Tag r={p.ruolo}/> <b>{p.nome}</b> <span className="pteam">{p.squadra}</span></span>
            <span className="row">
              <span className="num" style={{color:p.paid<=p.prezzo?'var(--ok)':'var(--warn)'}}>{p.paid}</span>
              <span className="num" style={{color:'var(--muted)',fontSize:12}}>val. {p.prezzo}</span>
              <button className="btn ghost sm" onClick={()=>upd(p.id,{owner:null,paid:null})}>↺</button>
            </span>
          </div>)}
        </div>;
      })}
      {!mine.length&&<div className="empty">Rosa vuota. Assegnati il primo giocatore dalla scheda Asta.</div>}
    </div>

    <div className="card">
      <h2>Obiettivi ancora liberi</h2>
      {M.ps.filter(p=>p.tgt&&!p.owner).sort((a,b)=>b.live-a.live).map(p=>
        <div key={p.id} className="row" style={{justifyContent:'space-between',padding:'4px 0'}}>
          <span><Tag r={p.ruolo}/> <b>{p.nome}</b> <span className="pteam">{p.squadra}</span></span>
          <span className="price">{p.live}</span>
        </div>)}
      {!M.ps.some(p=>p.tgt&&!p.owner)&&<div className="empty">Segna i tuoi obiettivi con ★ nel Listone.</div>}
    </div>
  </>;
}

/* ============================== TAB: SETUP ============================== */
function Setup({cfg,setCfg,importFile,reset,clearAuction,M,players,setPlayers,setDemo,setMsg}){
  const [nTeams,setNTeams]=useState(cfg.teams.length);
  const fileRef=useRef();

  function setTeams(n){
    n=clamp(n,2,20); setNTeams(n);
    const t=[...cfg.teams];
    while(t.length<n) t.push('Squadra '+(t.length+1));
    setCfg({...cfg,teams:t.slice(0,n)});
  }
  function exportJSON(){
    const blob=new Blob([JSON.stringify({cfg,players},null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='asta-backup.json'; a.click();
  }
  function importJSON(f){
    const fr=new FileReader();
    fr.onload=e=>{try{const d=JSON.parse(e.target.result);
      if(d.cfg)setCfg({...DEFCFG,...d.cfg}); if(d.players){setPlayers(d.players);setDemo(false);}
      setMsg('Backup ripristinato.');}catch(err){setMsg('File non valido.');}};
    fr.readAsText(f);
  }

  return <>
    <div className="card">
      <h2>Listone</h2>
      <p className="hint">Su fantacalcio.it scarica <b>Quotazioni</b> e <b>Statistiche</b> in Excel e caricali qui, uno alla volta:
        il secondo file si fonde con il primo. Riconosce le colonne Id, R, Nome, Squadra, Qt.A, FVM, Pv, Mv, Fm.</p>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}}
        onChange={e=>{if(e.target.files[0])importFile(e.target.files[0]); e.target.value='';}}/>
      <div className="row">
        <button className="btn" onClick={()=>fileRef.current.click()}>Carica file Excel</button>
        <button className="btn ghost" onClick={exportJSON}>Esporta backup</button>
        <label className="btn ghost" style={{display:'inline-block'}}>
          Importa backup
          <input type="file" accept=".json" style={{display:'none'}}
            onChange={e=>{if(e.target.files[0])importJSON(e.target.files[0]); e.target.value='';}}/>
        </label>
      </div>
      <p className="hint" style={{marginTop:9,marginBottom:0}}>{players.length} giocatori in archivio.</p>
    </div>

    <div className="card">
      <h2>Regole della lega</h2>
      <div className="grid g4">
        <Field label="Squadre"><Num value={nTeams} onChange={setTeams} min={2}/></Field>
        <Field label="Crediti"><Num value={cfg.budget} onChange={v=>setCfg({...cfg,budget:v||1})} min={1}/></Field>
        <Field label="Bonus rigorista"><Num value={cfg.rigBonus} step={0.05} onChange={v=>setCfg({...cfg,rigBonus:v})}/></Field>
        <Field label="Modificatore difesa">
          <select className="f" value={cfg.mod?'1':'0'} onChange={e=>setCfg({...cfg,mod:e.target.value==='1'})}>
            <option value="1">Attivo</option><option value="0">Non attivo</option>
          </select></Field>
      </div>
      {cfg.mod && <>
        <p className="hint" style={{marginTop:12}}>Il modificatore premia la <b>media voto</b> del blocco portiere + 3 difensori,
          non la fantamedia. Qui imposti quanti punti vale ogni 0,25 di media in più: sulla tabella standard è 1,
          ma <b>controlla il regolamento della tua lega</b> perché le soglie cambiano da lega a lega.</p>
        <div className="grid g4">
          <Field label="Punti ogni +0,25"><Num value={cfg.modK} step={0.25} onChange={v=>setCfg({...cfg,modK:v})}/></Field>
        </div>
      </>}
      <p className="hint" style={{marginTop:12}}>Slot in rosa e quanti ne schieri ogni giornata. I titolari definiscono il
        <b> livello del sostituto</b>: con {nTeams} squadre e {cfg.starters.C} centrocampisti titolari, il {nTeams*cfg.starters.C}° centrocampista
        è il "gratis" con cui confrontare tutti gli altri.</p>
      <div className="grid g4">
        {ROLES.map(R=><Field key={R} label={'Rosa '+R}>
          <Num value={cfg.slots[R]} onChange={v=>setCfg({...cfg,slots:{...cfg.slots,[R]:v||1}})} min={1}/></Field>)}
      </div>
      <div className="grid g4" style={{marginTop:10}}>
        {ROLES.map(R=><Field key={R} label={'Titolari '+R}>
          <Num value={cfg.starters[R]} onChange={v=>setCfg({...cfg,starters:{...cfg.starters,[R]:v||1}})} min={1}/></Field>)}
      </div>
    </div>

    <div className="card">
      <h2>Squadre</h2>
      <p className="hint">La prima sei tu. Cambia i nomi per riconoscere gli avversari durante l'asta.</p>
      <div className="grid g2">
        {cfg.teams.map((t,i)=><Field key={i} label={i===0?'Tu':'Squadra '+(i+1)}>
          <input className="f" value={t} onChange={e=>{
            const a=[...cfg.teams]; const old=a[i]; a[i]=e.target.value;
            setCfg({...cfg,teams:a});
            setPlayers(ps=>ps.map(p=>p.owner===old?{...p,owner:e.target.value}:p));
          }}/></Field>)}
      </div>
    </div>

    <div className="card">
      <h2>Come vengono fuori i prezzi</h2>
      <p className="hint" style={{marginBottom:0}}>
        Punti attesi = fantamedia proiettata × presenze attese. Al giocatore si sottrae il
        sostituto del suo ruolo: resta il <b>surplus</b>. Il monte crediti della lega
        ({M.pool}), tolto 1 credito per ogni casella da riempire ({M.seats}), viene diviso tra tutti in proporzione al surplus.
        Durante l'asta il calcolo si rifà su crediti e giocatori rimasti: è l'inflazione.
      </p>
    </div>

    <div className="card">
      <h2>Ricomincia</h2>
      <div className="row">
        <button className="btn ghost" onClick={clearAuction}>Azzera gli acquisti</button>
        <button className="btn ghost" onClick={()=>{if(confirm('Cancello tutto e torno ai dati demo?'))reset();}}>Reset totale</button>
      </div>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
