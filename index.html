<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0B1B2B"/>
<title>Los Conquistadores</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0B1B2B; --bg2:#122536; --line:#1E3A4F;
  --ink:#EAF2F8; --muted:#8AA4B8; --acc:#27C08A; --warn:#E8B44A; --bad:#E36868;
  --P:#E8A33D; --D:#2FB56B; --C:#4A8FE0; --A:#E05656;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
#root{max-width:560px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
/* ---------- testata ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 78%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top-r{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#8E1C2D,#3B0D16);
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.tname{font-size:16px;font-weight:700;letter-spacing:.2px}
.tsub{font-size:12px;color:var(--muted)}
/* ---------- giornata ---------- */
.gio{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.gio button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:19px;line-height:1}
.gio .mid{flex:1;text-align:center;min-width:0}
.gio .g{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gio .vs{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- campo ---------- */
.pitch{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#123A2A 0 44px,#0F3324 44px 88px);
  border:1px solid #1B4A35;padding:14px 6px 10px}
.pitch:before{content:"";position:absolute;left:50%;top:0;width:110px;height:110px;
  transform:translate(-50%,-55px);border:2px solid rgba(255,255,255,.13);border-radius:50%}
.line{display:flex;justify-content:center;gap:6px;margin-bottom:12px;position:relative}
.slot{width:78px;text-align:center;background:transparent;border:0;padding:0;color:var(--ink)}
.shirt{height:46px;border-radius:11px;background:rgba(6,20,14,.72);border:1px solid rgba(255,255,255,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.shirt.void{border-style:dashed;opacity:.55}
.shirt .fm{font-family:var(--mono);font-size:15px;font-weight:700}
.shirt .op{font-size:9.5px;color:#A9C6B6;text-transform:uppercase;letter-spacing:.04em}
.slot .nm{font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;border:2px solid #0F3324}
.dot.w{background:var(--warn)}.dot.b{background:var(--bad)}
/* ---------- moduli ---------- */
.mods{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.mods::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--muted);font-size:13.5px;font-weight:600}
.chip[data-on="1"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* ---------- bottoni ---------- */
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#05231A;
  font-size:15px;font-weight:700;margin-top:10px}
.btn.alt{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 13px;font-size:13.5px;margin-top:0}
/* ---------- card e liste ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.card h2{font-size:14px;margin-bottom:2px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.tag{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;
  font-weight:800;color:#06131C;flex:0 0 auto;font-family:var(--mono)}
.tag.P{background:var(--P)}.tag.D{background:var(--D)}.tag.C{background:var(--C)}.tag.A{background:var(--A)}
.pl .mid{flex:1;min-width:0}
.pl .n{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .r{text-align:right;flex:0 0 auto}
.pl .r b{font-family:var(--mono);font-size:15px}
.pl .r span{display:block;font-size:10.5px;color:var(--muted)}
/* ---------- foglio che sale ---------- */
.mask{position:fixed;inset:0;background:rgba(2,8,14,.62);z-index:60;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto}
.grab{width:38px;height:4px;border-radius:2px;background:#2C4B63;margin:0 auto 10px}
/* ---------- barra in basso ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,27,43,.96);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:0;border:0;color:var(--muted);padding:9px 2px 8px;font-size:10.5px;font-weight:600}
.nav button b{display:block;font-size:17px;font-weight:400;margin-bottom:1px}
.nav button[data-on="1"]{color:var(--acc)}
textarea,input[type=number]{width:100%;background:#0A1A29;color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-family:var(--mono);font-size:13px}
label.file{display:block;text-align:center}
label.file input{display:none}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.badge{font-size:10.5px;padding:2px 7px;border-radius:999px;background:#10402F;color:var(--acc);font-weight:700}
</style>
</head>

function useSquadre(stats){
  return useMemo(()=>{
    const out={};
    P.forEach(r=>{
      const [team,nome,sq,ruolo,costo,pv,mv,fm,gf,ass,amm,uff]=r;
      const s=stats?stats[norm(uff)+norm(sq)]:null;
      (out[team]=out[team]||[]).push({id:team+'|'+nome,team,nome,sq,ruolo,costo,
        pv:s?s.pv:pv, mv:s?s.mv:mv, fm:s?s.fm:fm, gf:s?s.gf:gf, ass:s?s.ass:ass, amm:s?s.amm:amm});
    });
    return out;
  },[stats]);
}

function valuta(p,turno,classifica){
  const t=turno[norm(p.sq)]||null;
  const pos=t?(classifica[norm(t.avv)]||10):10;
  const adj=t?((pos-10.5)/9.5)*0.30+(t.casa?0.15:-0.15):0;
  const base=(p.ruolo==='P'||p.ruolo==='D')?p.mv:p.fm;
  return {...p,t,pos,voto:base?+(base+adj).toFixed(2):null,
    stato:p.pv===0?'mai':(p.pv<=1?'poche':'')};
}

  TOK.provato=true;
  try{

/* valuta un modulo: sceglie i migliori per ruolo e stima i punti totali */
function valutaModulo(rosa,modulo,modSolo4){
  const q=modulo.split('-').map(Number);
  const n={P:1,D:q[0],C:q[1],A:q[2]};
  const ids={}, scelti=[];
  ROLES.forEach(R=>{
    const top=rosa.filter(p=>p.ruolo===R&&p.voto!==null&&p.stato!=='mai'&&!p.fuori)
                  .sort((a,b)=>b.voto-a.voto).slice(0,n[R]);
    ids[R]=top.map(p=>p.id);
    top.forEach(p=>scelti.push(p));
  });
  /* punti attesi = fantamedia + la stessa correzione per avversario e campo del voto atteso */
  const somma=scelti.reduce((t,p)=>{
    const base=(p.ruolo==='P'||p.ruolo==='D')?p.mv:p.fm;
    return t+(p.fm||0)+((p.voto||base)-base);
  },0);
  const mv=scelti.filter(p=>p.ruolo==='P'||p.ruolo==='D').map(p=>p.mv).filter(v=>v>0);
  const siApplica=!(modSolo4&&n.D<4)&&mv.length===1+n.D;
  const media=mv.length?mv.reduce((a,b)=>a+b,0)/mv.length:0;
  const mod=siApplica?modPunti(media):0;
  return {modulo:modulo,ids:ids,somma:somma,mod:mod,media:media,siApplica:siApplica,
          mancano:11-scelti.length,tot:somma+mod};
}

function Riga(props){
  const p=props.p;
  const sotto=p.sq+(p.t?' · '+(p.t.casa?'':'a ')+p.t.avv:' · turno non impostato')
    +(p.stato==='mai'?' · mai in campo':'')+(p.stato==='poche'?' · 1 presenza':'')
    +(p.fuori?' · INDISPONIBILE':'');
  return D('pl',{onClick:props.onClick,style:p.fuori?{opacity:.5}:null},
    S('tag '+p.ruolo,null,p.ruolo),
    D('mid',null, D('n',null,p.nome), D('s',null,sotto)),
    D('r',null, props.dx||[h('b',{key:'b'},p.voto?fmt(p.voto):'—'),h('span',{key:'s'},'atteso')])
  );
}

function Campo(props){
  const parti=props.modulo.split('-').map(Number);
  const linee=[['A',parti[2]],['C',parti[1]],['D',parti[0]],['P',1]];
  return D('pitch',props.bloccato?{style:{filter:'saturate(.55)'}}:null, linee.map(function(l){
    const R=l[0], n=l[1];
    const slot=[];
    for(let k=0;k<n;k++){
      const p=(props.schierati[R]||[])[k];
      slot.push(h('button',{className:'slot',key:R+k,
        onClick:()=>{ if(!props.bloccato) props.onSlot(R,k); }},
        D('shirt'+(p?'':' void'),null,
          p?S('fm',null,p.voto?fmt(p.voto):'—'):S('op',null,'vuoto'),
          p?S('op',null,(p.t?(p.t.casa?'':'@')+p.t.avv.slice(0,7):'—')):null,
          p&&(p.stato||p.fuori)?h('i',{className:'dot '+((p.fuori||p.stato==='mai')?'b':'w')}):null),
        D('nm',null,p?p.nome:'—')));
    }
    return D('line',{key:R},slot);
  }));
}

function App(){
  /* ---------- stato: un solo oggetto, salvato in locale e nel cloud ---------- */
  const [db,setDb]=useState(()=>{
    const salvato=memRaw.get('db');
    return salvato?completa(salvato):migra(k=>memRaw.get(k));
  });
  const [gio,setGio]=useState(()=>primaAperta((memRaw.get('db')||{}).chiuse||{}));
  const [vista,setVista]=useState('campo');
  const [apri,setApri]=useState(null);
  const [msg,setMsg]=useState('');
  const [cloudSt,setCloudSt]=useState('');
  const [localeOk,setLocaleOk]=useState(true);
  const daCloud=useRef(false);
  const timer=useRef(null);
  const pronto=useRef(false);     /* niente invii al cloud finché non ho letto cosa c'è già */
  const ultimo=useRef(null);

  const upd=fn=>setDb(d=>{
    const n=JSON.parse(JSON.stringify(d));
    const r=fn(n)||n; r.ts=Date.now(); return r;
  });

  /* salvataggio locale immediato, cloud dopo un attimo di quiete */
  function inviaCloud(dati){
    setCloudSt('salvataggio…');
    cloudSalva(dati.codice,{ts:dati.ts,json:JSON.stringify(dati)})
      .then(()=>setCloudSt('salvato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})))
      .catch(e=>setCloudSt('non salvato: '+e.message));
  }
  useEffect(()=>{
    ultimo.current=db;
    setLocaleOk(memRaw.set('db',db));
    if(!pronto.current) return;
    if(daCloud.current){ daCloud.current=false; return; }
    if(!db.ts) return;
    clearTimeout(timer.current);
    timer.current=setTimeout(()=>inviaCloud(ultimo.current),1500);
  },[db]);

  /* all'avvio: se nel cloud c'è una versione più recente, la prendo */
  useEffect(()=>{
    setCloudSt('controllo il cloud…');
    cloudLeggi(db.codice).then(remoto=>{
      let dati=null;
      try{ dati=remoto&&remoto.json?JSON.parse(remoto.json):null; }catch(e){ dati=null; }
      const locale=ultimo.current||db;
      if(dati&&dati.ts&&dati.ts>(locale.ts||0)){
        const r=completa(dati);
        daCloud.current=true; setDb(r); setGio(primaAperta(r.chiuse));
        setCloudSt('dati recuperati dal cloud');
        pronto.current=true;
      } else {
        pronto.current=true;
        if(locale.ts&&(!dati||locale.ts>(dati.ts||0))) inviaCloud(locale);
        else setCloudSt('allineato col cloud');
      }
    }).catch(e=>{ pronto.current=true; setCloudSt('cloud non raggiungibile: '+e.message); });
  },[]);

  /* ---------- derivati ---------- */
  const chiusa=db.chiuse[gio]||null;
  const modulo=chiusa?chiusa.modulo:(db.moduloG[gio]||db.moduloDef||'4-3-3');
  const setModulo=m=>upd(d=>{d.moduloG[gio]=m; d.moduloDef=m;});

  const squadre=useSquadre(db.stats);
  const turno=useMemo(()=>{
    const m={};
    (db.turno||'').split('\n').map(r=>r.trim()).filter(Boolean).forEach(r=>{
      const x=r.split('-').map(v=>(v||'').trim());
      if(x[0]&&x[1]){m[norm(x[0])]={avv:x[1],casa:true};m[norm(x[1])]={avv:x[0],casa:false};}
    });
    return m;
  },[db.turno]);
  const classifica=useMemo(()=>{
    const m={}; (db.classe||'').split(',').map(s=>s.trim()).filter(Boolean).forEach((s,i)=>{m[norm(s)]=i+1;});
    return m;
  },[db.classe]);

  const fuoriSet=useMemo(()=>new Set(db.fuori),[db.fuori]);
  const segna=id=>upd(d=>{d.fuori=d.fuori.indexOf(id)>=0?d.fuori.filter(x=>x!==id):d.fuori.concat([id]);});
  const rosa=useMemo(()=>(squadre[MIA]||[]).map(p=>{
    const v=valuta(p,turno,classifica); v.fuori=fuoriSet.has(v.id); return v;
  }),[squadre,turno,classifica,fuoriSet]);

  const turnoLega=CAL[((gio-CAL_DA)%CAL.length+CAL.length)%CAL.length];
  const sfida=(()=>{
    const m=turnoLega.find(x=>x[0]===MIA||x[1]===MIA);
    return m?{avv:m[0]===MIA?m[1]:m[0],casa:m[0]===MIA,idx:turnoLega.indexOf(m)}:null;
  })();

  const parti=modulo.split('-').map(Number);
  const quanti={P:1,D:parti[0],C:parti[1],A:parti[2]};

  const consiglio=useMemo(()=>valutaModulo(rosa,modulo,db.modSolo4).ids,[rosa,modulo,db.modSolo4]);
  const moduli=useMemo(()=>MODULI.map(m=>valutaModulo(rosa,m,db.modSolo4)).sort((a,b)=>b.tot-a.tot),[rosa,db.modSolo4]);
  const migliore=moduli[0];

  const mieScelte=db.scelta[gio]||null;
  const schierati=useMemo(()=>{
    if(chiusa) return chiusa.xi;
    const src=mieScelte||consiglio, out={};
    ROLES.forEach(R=>{
      const arr=[];
      for(let k=0;k<quanti[R];k++){
        const id=(src[R]||[])[k];
        arr.push(id?(rosa.find(p=>p.id===id)||null):null);
      }
      out[R]=arr;
    });
    return out;
  },[chiusa,mieScelte,consiglio,rosa,modulo]);

  const dentro=useMemo(()=>{
    const s=new Set();
    ROLES.forEach(R=>(schierati[R]||[]).forEach(p=>{if(p)s.add(p.id);}));
    return s;
  },[schierati]);
  const panchina=chiusa?chiusa.panca:rosa.filter(p=>!dentro.has(p.id))
    .sort((a,b)=>(ROLES.indexOf(a.ruolo)-ROLES.indexOf(b.ruolo))||((b.voto||0)-(a.voto||0)));

  const modif=(()=>{
    if(chiusa) return chiusa.modif;
    const q=schierati.P.concat(schierati.D).filter(Boolean).map(p=>p.mv).filter(v=>v>0);
    if(q.length<1+quanti.D) return null;
    if(db.modSolo4&&quanti.D<4) return {no:true};
    const m=q.reduce((a,b)=>a+b,0)/q.length;
    return {media:m,punti:modPunti(m)};
  })();
  const somma=chiusa?chiusa.somma:(()=>{
    let t=0; ROLES.forEach(R=>schierati[R].forEach(p=>{if(p)t+=p.fm||0;})); return t;
  })();

  const classificaLega=useMemo(()=>{
    const t={}; SQUADRE.forEach(n=>{t[n]={n:n,pt:0,g:0,v:0,p:0,s:0,ff:0,fs:0};});
    Object.keys(db.risul).forEach(g=>{
      const turni=CAL[((+g-CAL_DA)%CAL.length+CAL.length)%CAL.length];
      (db.risul[g]||[]).forEach((r,i)=>{
        if(!turni[i]||!r) return;
        const fa=parseFloat(r[0]), fb=parseFloat(r[1]);
        if(isNaN(fa)||isNaN(fb)) return;
        const a=turni[i][0], b=turni[i][1];
        if(!t[a]||!t[b]) return;
        t[a].g++;t[b].g++;t[a].ff+=fa;t[a].fs+=fb;t[b].ff+=fb;t[b].fs+=fa;
        if(fa>fb){t[a].pt+=3;t[a].v++;t[b].s++;}
        else if(fb>fa){t[b].pt+=3;t[b].v++;t[a].s++;}
        else {t[a].pt++;t[b].pt++;t[a].p++;t[b].p++;}
      });
    });
    return Object.keys(t).map(k=>t[k]).sort((x,y)=>(y.pt-x.pt)||(y.ff-x.ff)||x.n.localeCompare(y.n));
  },[db.risul]);

  const mioRis=sfida?((db.risul[gio]||[])[sfida.idx]||null):null;
  const mioRisOk=mioRis&&mioRis[0]!==''&&mioRis[1]!==''&&!isNaN(parseFloat(mioRis[0]))&&!isNaN(parseFloat(mioRis[1]));

  /* ---------- azioni ---------- */
  function auto(){ upd(d=>{d.scelta[gio]=consiglio;}); setMsg('Formazione compilata con i consigli.'); }
  function svuota(){ upd(d=>{delete d.scelta[gio];}); }
  function usaMigliore(){
    upd(d=>{d.moduloG[gio]=migliore.modulo; d.moduloDef=migliore.modulo; d.scelta[gio]=migliore.ids;});
    setMsg('Schierato il '+migliore.modulo+': '+migliore.tot.toFixed(1)+' punti attesi.');
  }
  function metti(R,k,id){
    upd(d=>{
      const cur=d.scelta[gio]||consiglio, nuovo={};
      ROLES.forEach(r=>{nuovo[r]=(cur[r]||[]).map(x=>x===id?null:x);});
      const arr=[];
      for(let i=0;i<quanti[R];i++) arr.push(nuovo[R][i]||null);
      arr[k]=id; nuovo[R]=arr;
      d.scelta[gio]=nuovo;
    });
    setApri(null);
  }

  function chiudi(){
    const xi={};
    ROLES.forEach(R=>{xi[R]=(schierati[R]||[]).map(foto);});
    const ids={};
    ROLES.forEach(R=>{ids[R]=xi[R].map(p=>p?p.id:null);});
    const snap={modulo:modulo, xi:xi, panca:panchina.map(foto), somma:somma, modif:modif,
      turno:db.turno, ts:Date.now()};
    upd(d=>{d.chiuse[gio]=snap; d.scelta[gio]=ids; d.moduloG[gio]=modulo;});
    const g=gio;
    setGio(Math.min(38,g+1));
    setMsg('Giornata '+g+' chiusa'+(mioRisOk?'':' (senza il tuo risultato: puoi riaprirla e aggiungerlo)')
      +'. Ora sei sulla '+Math.min(38,g+1)+'ª: ricordati di aggiornare le partite di Serie A in Dati.');
  }
  function riapri(){
    upd(d=>{
      const c=d.chiuse[gio];
      if(c){ d.moduloG[gio]=c.modulo; const ids={}; ROLES.forEach(R=>{ids[R]=(c.xi[R]||[]).map(p=>p?p.id:null);}); d.scelta[gio]=ids; }
      delete d.chiuse[gio];
    });
    setMsg('Giornata '+gio+' riaperta: correggi quello che serve e richiudila.');
  }

  function carica(file){
    const fr=new FileReader();
    fr.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const nome=wb.SheetNames.filter(n=>/tutti/i.test(n))[0]||wb.SheetNames[0];
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1});
        let hi=-1;
        rows.forEach((r,i)=>{ if(hi<0&&r&&r.some(c=>String(c||'').trim().toLowerCase()==='nome')) hi=i; });
        if(hi<0){ setMsg('Non trovo la riga di intestazione con "Nome".'); return; }
        const H=rows[hi].map(c=>String(c||'').trim().toLowerCase());
        const col=n=>H.indexOf(n);
        const out={}; let n=0, maxPv=0;
        rows.slice(hi+1).forEach(r=>{
          if(!r||!r[col('nome')]) return;
          const pv=+r[col('pv')]||0; if(pv>maxPv) maxPv=pv;
          out[norm(r[col('nome')])+norm(r[col('squadra')])]={
            pv:pv, mv:+r[col('mv')]||0, fm:+r[col('fm')]||0,
            gf:+r[col('gf')]||0, ass:+r[col('ass')]||0, amm:+r[col('amm')]||0};
          n++;
        });
        upd(d=>{d.stats=out;});
        const aperta=!db.chiuse[gio];
        setMsg('Aggiornate le statistiche di '+n+' giocatori (fino a '+maxPv+' presenze).'
          +(aperta?' Se la giornata '+gio+' è finita, inserisci il risultato in Lega e chiudila dal Campo.':''));
      }catch(err){ setMsg('Errore nel file: '+err.message); }
    };
    fr.readAsArrayBuffer(file);
  }

  function esporta(){
    try{
      const blob=new Blob([JSON.stringify(db)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='fanta-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ setMsg('Backup non riuscito: '+e.message); }
  }
  function importa(file){
    const fr=new FileReader();
    fr.onload=e=>{
      try{
        const x=completa(JSON.parse(e.target.result));
        if(!confirm('Sostituisco tutti i dati con quelli del backup?')) return;
        upd(()=>x); setGio(primaAperta(x.chiuse));
        setMsg('Backup ripristinato.');
      }catch(err){ setMsg('Backup non valido: '+err.message); }
    };
    fr.readAsText(file);
  }

  function testo(){
    const r=l=>l.filter(Boolean).map(p=>'  '+p.ruolo+' '+p.nome+' ('+p.sq+') mv '+(p.mv||'-')+' fm '+(p.fm||'-')
      +' pres '+p.pv+' — '+(p.t?(p.t.casa?'in casa con ':'in trasferta a ')+p.t.avv:'turno ignoto')).join('\n');
    const inCampo=[]; ROLES.forEach(R=>(schierati[R]||[]).forEach(p=>inCampo.push(p)));
    return 'LOS CONQUISTADORES — giornata '+gio+(chiusa?' (chiusa)':'')+'\n'
      +(sfida?'In lega: '+sfida.avv+' ('+(sfida.casa?'casa':'trasferta')+')\n':'')
      +'Modulo '+modulo+(modif&&!modif.no?' · modificatore '+modif.media.toFixed(2)+' → +'+modif.punti:'')
      +'\n\nIN CAMPO\n'+r(inCampo)+'\n\nPANCHINA\n'+r(panchina)+'\n';
  }

  /* ---------- testata ---------- */
  const testata=D('top',null,
    D('top-r',null,
      D('crest',null,'LC'),
      D('',{style:{flex:1,minWidth:0}},
        D('tname',null,'Los Conquistadores'),
        D('tsub',null,'LaFiga · 8 squadre · modificatore con 4+ difensori'))),
    D('gio',null,
      h('button',{onClick:()=>setGio(g=>Math.max(CAL_DA,g-1))},'‹'),
      D('mid',null, D('g',null,'giornata '+gio+(chiusa?' · chiusa':'')),
        D('vs',null, sfida?(sfida.casa?'in casa con ':'in trasferta da ')+sfida.avv:'—')),
      h('button',{onClick:()=>setGio(g=>Math.min(38,g+1))},'›')));

  /* ---------- campo ---------- */
  const risTesto=mioRisOk?(sfida.casa?mioRis[0]+' – '+mioRis[1]:mioRis[1]+' – '+mioRis[0]):null;
  const paginaCampo=[
    chiusa?D('card',{key:'ch',style:{borderColor:'var(--acc)'}},
      D('kv',null,S('',null,'Giornata chiusa'),h('b',{className:'num'},risTesto?'finita '+risTesto:'risultato non inserito')),
      h('p',{className:'hint'},'La formazione è congelata così com\'era. Per correggere un errore riaprila.'),
      h('button',{className:'btn alt',onClick:riapri},'Riapri la giornata '+gio))
    :D('card',{key:'best',style:{borderColor:migliore.modulo===modulo?'var(--line)':'var(--acc)'}},
      D('kv',null,S('',null,'Modulo migliore'),
        h('b',{className:'num'},migliore.modulo+' · '+migliore.tot.toFixed(1)+' pt')),
      migliore.modulo!==modulo?h('button',{className:'btn',onClick:usaMigliore},
        'Usa il '+migliore.modulo+' e compila'):
        h('p',{className:'hint'},'Stai già usando il modulo che rende di più.'),
      h('details',{style:{marginTop:8}},
        h('summary',{className:'hint',style:{cursor:'pointer'}},'Confronta tutti i moduli'),
        moduli.map(r=>D('kv',{key:r.modulo,style:{fontWeight:r.modulo===modulo?700:400}},
          S('',null,r.modulo+(r.mancano?' · ne mancano '+r.mancano:'')),
          S('num',{style:{color:'var(--muted)',fontSize:12}},
            r.somma.toFixed(1)+(r.siApplica?' + '+r.mod+' mod':' · mod no')+' = '),
          h('b',{className:'num'},r.tot.toFixed(1)))))),
    chiusa?null:D('mods',{key:'m'}, MODULI.map(m=>h('button',{key:m,className:'chip','data-on':modulo===m?'1':'0',
      onClick:()=>setModulo(m)},m))),
    h(Campo,{key:'c',schierati:schierati,modulo:modulo,bloccato:!!chiusa,onSlot:(R,k)=>setApri({R:R,k:k})}),
    D('card',{key:'r',style:{marginTop:10}},
      D('kv',null,S('',null,'Somma fantamedie'),h('b',{className:'num'},Number(somma||0).toFixed(2))),
      D('kv',null,S('',null,'Modificatore difesa'),
        h('b',{className:'num'},modif?(modif.no?'non si applica':modif.media.toFixed(2)+' → +'+modif.punti):'—')),
      D('kv',null,S('',null,'Formazione'),
        chiusa?S('',null,'congelata'):(mieScelte?S('',null,'scelta da te'):S('badge',null,'consigliata')))),
    chiusa?null:h('button',{key:'b1',className:'btn alt',onClick:auto},'Compila con i consigli'),
    (!chiusa&&mieScelte)?h('button',{key:'b2',className:'btn alt',onClick:svuota},'Torna ai consigli'):null,
    h('button',{key:'b3',className:'btn alt',onClick:()=>{
      try{navigator.clipboard.writeText(testo());setMsg('Riepilogo copiato: incollalo in chat per un parere.');}
      catch(e){setMsg('Copia non riuscita.');}}},'Copia riepilogo'),
    chiusa?null:h('button',{key:'b4',className:'btn',onClick:()=>{
      if(confirm('Chiudo la giornata '+gio+'? La formazione verrà congelata e passerai alla '+Math.min(38,gio+1)+'ª.'
        +(mioRisOk?'':'\n\nAttenzione: non hai ancora inserito il tuo risultato in Lega.'))) chiudi();
    }},'Chiudi la giornata '+gio),
    D('card',{key:'p'}, h('h2',null,'Panchina'),
      panchina.map(p=>h(Riga,{key:p.id,p:p,onClick:chiusa?null:()=>setApri({R:p.ruolo,k:null})}))),
    chiusa?null:h('p',{key:'h',className:'hint',style:{padding:'0 2px 4px'}},
      'Tocca una maglia per cambiare il giocatore. Il numero è il voto atteso: fantamedia corretta per avversario e campo, media voto per portiere e difensori. Pallino giallo con una sola presenza, rosso se non ha mai giocato o è indisponibile.')
  ];

  /* ---------- rosa ---------- */
  const paginaRosa=D('card',null, h('h2',null,'La mia rosa'),
    h('p',{className:'hint'},'Tocca un giocatore per segnarlo indisponibile. Sparisce dai consigli finché non lo rimetti.'),
    ROLES.map(R=>D('',{key:R}, rosa.filter(p=>p.ruolo===R).sort((a,b)=>(b.fm||0)-(a.fm||0))
      .map(p=>h(Riga,{key:p.id,p:p,onClick:()=>segna(p.id),
        dx:[h('b',{key:'b'},fmt(p.fm)),h('span',{key:'s'},p.fuori?'fuori':p.pv+' pres')]})))),
    db.fuori.length?h('button',{className:'btn alt',onClick:()=>upd(d=>{d.fuori=[];})},
      'Rimetti tutti disponibili ('+db.fuori.length+')'):null);

  /* ---------- lega ---------- */
  const paginaLega=[
    D('card',{key:'cl'}, h('h2',null,'Classifica'),
      h('p',{className:'hint'},'Vittoria 3, pareggio 1. A parità di punti contano i fantapunti fatti.'),
      classificaLega.map((r,i)=>D('kv',{key:r.n,style:{fontWeight:r.n===MIA?700:400}},
        S('',{style:{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},(i+1)+'. '+r.n),
        S('num',{style:{width:120,textAlign:'right',color:'var(--muted)',fontSize:12}},
          r.g+' · '+r.v+' '+r.p+' '+r.s+' · '+r.ff.toFixed(0)),
        S('num',{style:{width:32,textAlign:'right'}},h('b',null,r.pt))))),
    D('card',{key:'ri'}, h('h2',null,'Risultati · giornata '+gio+(chiusa?' · chiusa':'')),
      h('p',{className:'hint'},chiusa?'Giornata chiusa: per modificare i risultati riaprila dal Campo.'
        :'I fantapunti totali di ogni squadra, modificatore compreso. In grassetto la tua sfida.'),
      turnoLega.map((m,i)=>{
        const r=(db.risul[gio]||[])[i]||['',''];
        const set=(k,v)=>upd(d=>{
          const arr=(d.risul[gio]||[['',''],['',''],['',''],['','']]).map(x=>(x||['','']).slice());
          arr[i][k]=v; d.risul[gio]=arr;
        });
        const mio=m[0]===MIA||m[1]===MIA;
        return D('',{key:i,style:{display:'flex',alignItems:'center',gap:6,padding:'7px 0',
            borderBottom:'1px solid var(--line)',fontWeight:mio?700:400,fontSize:13}},
          S('',{style:{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},m[0]),
          h('input',{type:'number',step:'0.5',inputMode:'decimal',value:r[0],disabled:!!chiusa,
            onChange:e=>set(0,e.target.value),style:{width:62,padding:6,textAlign:'center'}}),
          h('input',{type:'number',step:'0.5',inputMode:'decimal',value:r[1],disabled:!!chiusa,
            onChange:e=>set(1,e.target.value),style:{width:62,padding:6,textAlign:'center'}}),
          S('',{style:{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textAlign:'right'}},m[1]));
      })),
    sfida?D('card',{key:'av'}, h('h2',null,sfida.avv),
      h('p',{className:'hint'},'Chi può schierarti contro, per fantamedia.'),
      (squadre[sfida.avv]||[]).map(p=>valuta(p,turno,classifica)).sort((a,b)=>(b.fm||0)-(a.fm||0)).slice(0,12)
        .map(p=>h(Riga,{key:p.id,p:p,dx:[h('b',{key:'b'},fmt(p.fm)),h('span',{key:'s'},p.pv+' pres')]}))):null
  ];

  /* ---------- dati ---------- */
  const paginaDati=[
    D('card',{key:'st'}, h('h2',null,'Statistiche'),
      h('p',{className:'hint'},'Scarica da Fantacalcio.it, Risorse → Statistiche, il pulsante Scarica. Poi carica qui il file dopo ogni giornata.'),
      h('label',{className:'file btn alt',style:{marginTop:10}},'Carica il file .xlsx',
        h('input',{type:'file',accept:'.xlsx,.xls',onChange:e=>{
          const f=e.target.files[0]; if(f) carica(f); e.target.value='';}})),
      h('p',{className:'hint'},db.stats?'Statistiche caricate dal tuo file.':'Al momento uso quelle del 17/09/2026, dopo 4 giornate.')),
    D('card',{key:'tu'}, h('h2',null,'Partite di Serie A'),
      h('p',{className:'hint'},'Una riga per partita, formato Casa-Trasferta. Aggiorna a ogni giornata.'),
      h('textarea',{rows:11,value:db.turno,onChange:e=>{const v=e.target.value;upd(d=>{d.turno=v;});}})),
    D('card',{key:'cs'}, h('h2',null,'Classifica di Serie A'),
      h('p',{className:'hint'},'Dalla prima all\'ultima, separate da virgola. Serve a pesare la difficoltà dell\'avversario.'),
      h('textarea',{rows:4,value:db.classe,onChange:e=>{const v=e.target.value;upd(d=>{d.classe=v;});}})),
    D('card',{key:'mo'}, h('h2',null,'Modificatore di difesa'),
      h('p',{className:'hint'},'Le soglie della tua lega, sulla media voto di portiere e difensori schierati.'),
      MOD_SOGLIE.map(s=>D('kv',{key:s[0]},S('',null,s[0]),h('b',{className:'num'},s[1]))),
      D('kv',{style:{marginTop:8}},S('',null,'Vale solo con almeno 4 difensori'),
        h('button',{className:'chip','data-on':db.modSolo4?'1':'0',onClick:()=>upd(d=>{d.modSolo4=!d.modSolo4;})},db.modSolo4?'sì':'no'))),
    D('card',{key:'sv'}, h('h2',null,'Salvataggio'),
      h('p',{className:'hint'},'Tutto viene salvato sul telefono e nel cloud, così non perdi niente anche se il browser cancella i dati.'),
      D('kv',null,S('',null,'Telefono'),S('',{style:{color:localeOk?'var(--acc)':'var(--bad)'}},localeOk?'ok':'il browser non salva')),
      D('kv',null,S('',null,'Cloud'),S('',{style:{fontSize:12.5,textAlign:'right',
        color:/non |errore/.test(cloudSt)?'var(--bad)':'var(--muted)'}},cloudSt||'—')),
      D('kv',null,S('',null,'Codice'),S('num',{style:{fontSize:12}},db.codice)),
      h('button',{className:'btn alt',onClick:esporta},'Scarica un backup'),
      h('label',{className:'file btn alt'},'Ripristina da backup',
        h('input',{type:'file',accept:'.json,application/json',onChange:e=>{
          const f=e.target.files[0]; if(f) importa(f); e.target.value='';}})),
      h('p',{className:'hint'},'Sull\'altro telefono o computer, se il codice è lo stesso, i dati arrivano da soli all\'apertura.'))
  ];

  /* ---------- foglio di scelta ---------- */
  const nomeRuolo={P:'portiere',D:'difensore',C:'centrocampista',A:'attaccante'};
  const foglio=(apri&&!chiusa)?D('mask',{onClick:()=>setApri(null)},
    D('sheet',{onClick:e=>e.stopPropagation()},
      D('grab'),
      h('h2',{style:{fontSize:15}},'Scegli un '+nomeRuolo[apri.R]),
      h('p',{className:'hint'},'In ordine di voto atteso. Chi è già in campo compare in fondo.'),
      rosa.filter(p=>p.ruolo===apri.R)
        .sort((a,b)=>((a.fuori?1:0)-(b.fuori?1:0))||((dentro.has(a.id)?1:0)-(dentro.has(b.id)?1:0))||((b.voto||0)-(a.voto||0)))
        .map(p=>h(Riga,{key:p.id,p:p,
          onClick:()=>{
            let k=apri.k;
            if(k===null||k===undefined){
              const vuoto=schierati[apri.R].indexOf(null);
              k=vuoto>=0?vuoto:schierati[apri.R].length-1;
            }
            metti(apri.R,k,p.id);
          },
          dx:[h('b',{key:'b'},p.voto?fmt(p.voto):'—'),h('span',{key:'s'},p.fuori?'indisponibile':(dentro.has(p.id)?'in campo':'panchina'))]})))):null;

  const barra=h('nav',{className:'nav'},
    [['campo','⚽','Campo'],['rosa','👥','Rosa'],['lega','🏆','Lega'],['dati','⚙','Dati']].map(v=>
      h('button',{key:v[0],'data-on':vista===v[0]?'1':'0',onClick:()=>setVista(v[0])},
        h('b',null,v[1]),v[2])));

  return h(React.Fragment,null,
    testata,
    msg?D('card',{onClick:()=>setMsg(''),style:{borderColor:'var(--acc)'}},
      D('',{style:{fontSize:13}},msg),h('p',{className:'hint'},'tocca per chiudere')):null,
    vista==='campo'?paginaCampo:null,
    vista==='rosa'?paginaRosa:null,
    vista==='lega'?paginaLega:null,
    vista==='dati'?paginaDati:null,
    foglio,
    barra);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
