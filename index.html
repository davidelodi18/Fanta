<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0B1B2B"/>
<title>Los Conquistadores</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0B1B2B; --bg2:#122536; --line:#1E3A4F;
  --ink:#EAF2F8; --muted:#8AA4B8; --acc:#27C08A; --warn:#E8B44A; --bad:#E36868;
  --P:#E8A33D; --D:#2FB56B; --C:#4A8FE0; --A:#E05656;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
#root{max-width:560px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
/* ---------- testata ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 78%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top-r{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#8E1C2D,#3B0D16);
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.tname{font-size:16px;font-weight:700;letter-spacing:.2px}
.tsub{font-size:12px;color:var(--muted)}
/* ---------- giornata ---------- */
.gio{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.gio button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:19px;line-height:1}
.gio .mid{flex:1;text-align:center;min-width:0}
.gio .g{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gio .vs{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- campo ---------- */
.pitch{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#123A2A 0 44px,#0F3324 44px 88px);
  border:1px solid #1B4A35;padding:14px 6px 10px}
.pitch:before{content:"";position:absolute;left:50%;top:0;width:110px;height:110px;
  transform:translate(-50%,-55px);border:2px solid rgba(255,255,255,.13);border-radius:50%}
.line{display:flex;justify-content:center;gap:6px;margin-bottom:12px;position:relative}
.slot{width:78px;text-align:center;background:transparent;border:0;padding:0;color:var(--ink)}
.shirt{height:46px;border-radius:11px;background:rgba(6,20,14,.72);border:1px solid rgba(255,255,255,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.shirt.void{border-style:dashed;opacity:.55}
.shirt .fm{font-family:var(--mono);font-size:15px;font-weight:700}
.shirt .op{font-size:9.5px;color:#A9C6B6;text-transform:uppercase;letter-spacing:.04em}
.slot .nm{font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;border:2px solid #0F3324}
.dot.w{background:var(--warn)}.dot.b{background:var(--bad)}
/* ---------- moduli ---------- */
.mods{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.mods::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--muted);font-size:13.5px;font-weight:600}
.chip[data-on="1"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* ---------- bottoni ---------- */
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#05231A;
  font-size:15px;font-weight:700;margin-top:10px}
.btn.alt{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 13px;font-size:13.5px;margin-top:0}
/* ---------- card e liste ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.card h2{font-size:14px;margin-bottom:2px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.tag{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;
  font-weight:800;color:#06131C;flex:0 0 auto;font-family:var(--mono)}
.tag.P{background:var(--P)}.tag.D{background:var(--D)}.tag.C{background:var(--C)}.tag.A{background:var(--A)}
.pl .mid{flex:1;min-width:0}
.pl .n{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .r{text-align:right;flex:0 0 auto}
.pl .r b{font-family:var(--mono);font-size:15px}
.pl .r span{display:block;font-size:10.5px;color:var(--muted)}
/* ---------- foglio che sale ---------- */
.mask{position:fixed;inset:0;background:rgba(2,8,14,.62);z-index:60;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto}
.grab{width:38px;height:4px;border-radius:2px;background:#2C4B63;margin:0 auto 10px}
/* ---------- barra in basso ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,27,43,.96);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:0;border:0;color:var(--muted);padding:9px 2px 8px;font-size:10.5px;font-weight:600}
.nav button b{display:block;font-size:17px;font-weight:400;margin-bottom:1px}
.nav button[data-on="1"]{color:var(--acc)}
textarea,input[type=number]{width:100%;background:#0A1A29;color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-family:var(--mono);font-size:13px}
label.file{display:block;text-align:center}
label.file input{display:none}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.badge{font-size:10.5px;padding:2px 7px;border-radius:999px;background:#10402F;color:var(--acc);font-weight:700}
</style>
</head>

/* ===================== LOGICA ===================== */
function useSquadre(stats){
  return useMemo(()=>{
    const out={};
    P.forEach(r=>{
      const [team,nome,sq,ruolo,costo,pv,mv,fm,gf,ass,amm,uff]=r;
      const s=stats?stats[norm(uff)+norm(sq)]:null;
      (out[team]=out[team]||[]).push({id:team+'|'+nome,team,nome,sq,ruolo,costo,
        pv:s?s.pv:pv, mv:s?s.mv:mv, fm:s?s.fm:fm, gf:s?s.gf:gf, ass:s?s.ass:ass, amm:s?s.amm:amm});
    });
    return out;
  },[stats]);
}

function valuta(p,turno,classifica){
  const t=turno[norm(p.sq)]||null;
  const pos=t?(classifica[norm(t.avv)]||10):10;
  const adj=t?((pos-10.5)/9.5)*0.30+(t.casa?0.15:-0.15):0;
  const base=(p.ruolo==='P'||p.ruolo==='D')?p.mv:p.fm;
  return {...p,t,pos,voto:base?+(base+adj).toFixed(2):null,
    stato:p.pv===0?'mai':(p.pv<=1?'poche':'')};
}

function Riga({p,dx,onClick}){

    </div>

  </div>;
}

function Campo({schierati,onSlot,modulo}){
  const classificaLega=useMemo(()=>{
    const t={}; SQUADRE.forEach(n=>t[n]={n,pt:0,g:0,v:0,p:0,s:0,ff:0,fs:0});
    Object.entries(risul).forEach(([g,arr])=>{
      const turni=CAL[((+g-CAL_DA)%CAL.length+CAL.length)%CAL.length];
      (arr||[]).forEach((r,i)=>{
        if(!turni[i]||r==null||r[0]==null||r[1]==null||r[0]===''||r[1]==='')return;
        const [a,b]=turni[i], fa=+r[0], fb=+r[1];
        if(isNaN(fa)||isNaN(fb))return;
        t[a].g++;t[b].g++; t[a].ff+=fa;t[a].fs+=fb; t[b].ff+=fb;t[b].fs+=fa;
        if(fa>fb){t[a].pt+=3;t[a].v++;t[b].s++;}
        else if(fb>fa){t[b].pt+=3;t[b].v++;t[a].s++;}
        else {t[a].pt++;t[b].pt++;t[a].p++;t[b].p++;}
      });
    });
    return Object.values(t).sort((x,y)=>y.pt-x.pt||y.ff-x.ff||x.n.localeCompare(y.n));
  },[risul]);

  const [nd,nc,na]=modulo.split('-').map(Number);
  const linee=[['A',na],['C',nc],['D',nd],['P',1]];
  let i={P:0,D:0,C:0,A:0};
  return <div className="pitch">
    {linee.map(([R,n])=>
      <div className="line" key={R}>
        {Array.from({length:n}).map((_,k)=>{
          const p=schierati[R][k];
          return <button className="slot" key={R+k} onClick={()=>onSlot(R,k)}>
            <div className={'shirt'+(p?'':' void')}>
              {p?<>
                <span className="fm">{p.voto?p.voto.toFixed(2):'—'}</span>
                <span className="op">{p.t?(p.t.casa?'':'@')+p.t.avv.slice(0,7):'—'}</span>
                {p.stato&&<i className={'dot '+(p.stato==='mai'?'b':'w')}/>}
              </>:<span className="op">vuoto</span>}
            </div>
            <div className="nm">{p?p.nome:'—'}</div>
          </button>;
        })}
      </div>)}
  </div>;
}

      (arr||[]).forEach((r,i)=>{
        if(!turni[i]||r==null||r[0]==null||r[1]==null||r[0]===''||r[1]==='')return;
        const [a,b]=turni[i], fa=+r[0], fb=+r[1];
        if(isNaN(fa)||isNaN(fb))return;
        t[a].g++;t[b].g++; t[a].ff+=fa;t[a].fs+=fb; t[b].ff+=fb;t[b].fs+=fa;
        if(fa>fb){t[a].pt+=3;t[a].v++;t[b].s++;}
        else if(fb>fa){t[b].pt+=3;t[b].v++;t[a].s++;}
        else {t[a].pt++;t[b].pt++;t[a].p++;t[b].p++;}
      });
    });
    return Object.values(t).sort((x,y)=>y.pt-x.pt||y.ff-x.ff||x.n.localeCompare(y.n));
  },[risul]);

  const [nd,nc,na]=modulo.split('-').map(Number);
  const quanti={P:1,D:nd,C:nc,A:na};

  const consiglio=useMemo(()=>{
    const out={};
    ROLES.forEach(R=>{
      out[R]=rosa.filter(p=>p.ruolo===R&&p.voto!==null&&p.stato!=='mai')
                 .sort((a,b)=>b.voto-a.voto).slice(0,quanti[R]).map(p=>p.id);
    });
    return out;},[rosa,modulo]);

  const mieScelte=scelta[gio]||null;
  const schierati=useMemo(()=>{
    const src=mieScelte||consiglio, out={};
    ROLES.forEach(R=>{
      out[R]=Array.from({length:quanti[R]}).map((_,k)=>{
        const id=(src[R]||[])[k];
        return id?rosa.find(p=>p.id===id)||null:null;});
    });
    return out;},[mieScelte,consiglio,rosa,modulo]);

  const dentro=useMemo(()=>new Set(ROLES.flatMap(R=>schierati[R].filter(Boolean).map(p=>p.id))),[schierati]);
  const panchina=useMemo(()=>rosa.filter(p=>!dentro.has(p.id))
    .sort((a,b)=>ROLES.indexOf(a.ruolo)-ROLES.indexOf(b.ruolo)||(b.voto??-9)-(a.voto??-9)),[rosa,dentro]);

  const modif=useMemo(()=>{
    const q=[...schierati.P,...schierati.D].filter(Boolean).map(p=>p.mv).filter(v=>v>0);
    if(q.length<1+nd) return null;
    const m=q.reduce((a,b)=>a+b,0)/q.length;
    return {media:m,punti:modPunti(m)};},[schierati,nd]);

  const somma=useMemo(()=>ROLES.flatMap(R=>schierati[R]).filter(Boolean)
    .reduce((s,p)=>s+(p.fm||0),0),[schierati]);

  function auto(){ setScelta(s=>({...s,[gio]:consiglio})); setMsg('Formazione compilata con i consigli.'); }
  function svuota(){ setScelta(s=>{const n={...s}; delete n[gio]; return n;}); }
  function metti(R,k,id){
    setScelta(s=>{
      const cur=s[gio]||consiglio;
      const nuovo={}; ROLES.forEach(r=>nuovo[r]=[...(cur[r]||[])]);
      ROLES.forEach(r=>{nuovo[r]=nuovo[r].map(x=>x===id?null:x);});
      nuovo[R]=Array.from({length:quanti[R]}).map((_,i)=>nuovo[R][i]??null);
      nuovo[R][k]=id;
      return {...s,[gio]:nuovo};
    });
    setApri(null);
  }

  function carica(file){
    const fr=new FileReader();
    fr.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const sh=wb.Sheets[wb.SheetNames.find(n=>/tutti/i.test(n))||wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sh,{header:1});
        const hi=rows.findIndex(r=>r&&r.some(c=>/^nome$/i.test(String(c||'').trim())));
        if(hi<0){setMsg('Non trovo la riga di intestazione con "Nome".');return;}
        const H=rows[hi].map(c=>String(c||'').trim().toLowerCase());
        const col=n=>H.indexOf(n);
        const out={};let n=0;
        rows.slice(hi+1).forEach(r=>{
          if(!r||!r[col('nome')])return;
          const k=norm(r[col('nome')])+norm(r[col('squadra')]);
          out[k]={pv:+r[col('pv')]||0,mv:+r[col('mv')]||0,fm:+r[col('fm')]||0,
                  gf:+r[col('gf')]||0,ass:+r[col('ass')]||0,amm:+r[col('amm')]||0};
          n++;});
        setStats(out); mem.set('stats',out);
        setMsg('Aggiornate le statistiche di '+n+' giocatori.');
      }catch(err){setMsg('Errore nel file: '+err.message);}
    };
    fr.readAsArrayBuffer(file);
  }

  function testo(){
    const r=l=>l.filter(Boolean).map(p=>`  ${p.ruolo} ${p.nome} (${p.sq}) mv ${p.mv||'-'} fm ${p.fm||'-'} pres ${p.pv} — ${p.t?(p.t.casa?'in casa con ':'in trasferta a ')+p.t.avv:'turno ignoto'}`).join('\n');
    return `LOS CONQUISTADORES — giornata ${gio}\n`+
      (sfida?`In lega: ${sfida.avv} (${sfida.casa?'casa':'trasferta'})\n`:'')+
      `Modulo ${modulo}${modif?` · modificatore ${modif.media.toFixed(2)} → +${modif.punti}`:''}\n\nIN CAMPO\n`+
      r(ROLES.flatMap(R=>schierati[R]))+`\n\nPANCHINA\n`+r(panchina)+`\n`;
  }

  return <>
    <div className="top">
      <div className="top-r">
        <div className="crest">LC</div>
        <div style={{flex:1,minWidth:0}}>
          <div className="tname">Los Conquistadores</div>
          <div className="tsub">LaFiga · 8 squadre · modificatore attivo</div>
        </div>
      </div>
      <div className="gio">
        <button onClick={()=>setGio(g=>Math.max(CAL_DA,g-1))}>‹</button>
        <div className="mid">
          <div className="g">giornata {gio}</div>
          <div className="vs">{sfida?(sfida.casa?'in casa con ':'in trasferta da ')+sfida.avv:'—'}</div>
        </div>
        <button onClick={()=>setGio(g=>Math.min(38,g+1))}>›</button>
      </div>
    </div>

    {msg&&<div className="card" onClick={()=>setMsg('')} style={{borderColor:'var(--acc)'}}>
      <div style={{fontSize:13}}>{msg}</div><p className="hint">tocca per chiudere</p></div>}

    {vista==='campo'&&<>
      <div className="mods">
        {MODULI.map(m=><button key={m} className="chip" data-on={modulo===m?'1':'0'} onClick={()=>setModulo(m)}>{m}</button>)}
      </div>
      <Campo schierati={schierati} modulo={modulo} onSlot={(R,k)=>setApri({R,k})}/>
      <div className="card" style={{marginTop:10}}>
        <div className="kv"><span>Somma fantamedie</span><b className="num">{somma.toFixed(2)}</b></div>
        <div className="kv"><span>Modificatore difesa</span>
          <b className="num">{modif?modif.media.toFixed(2)+' → +'+modif.punti:'—'}</b></div>
        <div className="kv"><span>Formazione</span>
          <span>{mieScelte?'scelta da te':<span className="badge">consigliata</span>}</span></div>
      </div>
      <button className="btn" onClick={auto}>Compila con i consigli</button>
      {mieScelte&&<button className="btn alt" onClick={svuota}>Torna ai consigli</button>}
      <button className="btn alt" onClick={()=>{navigator.clipboard.writeText(testo());setMsg('Riepilogo copiato: incollalo in chat per un parere.');}}>Copia riepilogo</button>
      <div className="card">
        <h2>Panchina</h2>
        {panchina.map(p=><Riga key={p.id} p={p} onClick={()=>setApri({R:p.ruolo,k:null,pre:p.id})}/>)}
      </div>
      <p className="hint" style={{padding:'0 2px 4px'}}>Tocca una maglia per cambiare il giocatore.
        Il numero sulla maglia è il voto atteso: fantamedia di stagione corretta per avversario e campo,
        media voto per portiere e difensori. Pallino giallo se ha una sola presenza, rosso se non ha mai giocato.</p>
    </>}

    {vista==='rosa'&&<div className="card">
      <h2>La mia rosa</h2>
      <p className="hint">{rosa.length} giocatori · ordinati per ruolo e rendimento</p>
      {ROLES.map(R=><div key={R}>
        {rosa.filter(p=>p.ruolo===R).sort((a,b)=>(b.fm||0)-(a.fm||0)).map(p=>
          <Riga key={p.id} p={p} dx={<><b>{p.fm?p.fm.toFixed(2):'—'}</b><span>{p.pv} pres</span></>}/>)}
      </div>)}
    </div>}

    {vista==='lega'&&<>
      <div className="card">
        <h2>Classifica</h2>
        <p className="hint">Vittoria 3, pareggio 1. A parità di punti conta il totale dei fantapunti fatti.</p>
        <div className="kv" style={{color:'var(--muted)',fontSize:11.5}}>
          <span style={{flex:1}}>squadra</span><span className="num" style={{width:118,textAlign:'right'}}>G · V N P · FP</span><span className="num" style={{width:30,textAlign:'right'}}>pt</span></div>
        {classificaLega.map((r,i)=>
          <div className="kv" key={r.n} style={{fontWeight:r.n===MIA?700:400}}>
            <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{i+1}. {r.n}</span>
            <span className="num" style={{width:118,textAlign:'right',color:'var(--muted)',fontSize:12}}>{r.g} · {r.v} {r.p} {r.s} · {r.ff.toFixed(0)}</span>
            <span className="num" style={{width:30,textAlign:'right'}}><b>{r.pt}</b></span></div>)}
        {!Object.keys(risul).length&&<p className="hint">Tutti a zero: la prima giornata è la 5ª. Inserisci i fantapunti qui sotto e la classifica si costruisce.</p>}
      </div>
      <div className="card">
        <h2>Risultati · giornata {gio}</h2>
        <p className="hint">I fantapunti totali di ogni squadra, modificatore compreso. Le sfide in grassetto sono le tue.</p>
        {CAL[((gio-CAL_DA)%CAL.length+CAL.length)%CAL.length].map((m,i)=>{
          const r=(risul[gio]||[])[i]||['',''];
          const set=(k,v)=>setRisul(o=>{
            const arr=[...(o[gio]||[['',''],['',''],['',''],['','']])];
            arr[i]=[...(arr[i]||['',''])]; arr[i][k]=v;
            return {...o,[gio]:arr};});
          const mio=m[0]===MIA||m[1]===MIA;
          return <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 0',
              borderBottom:'1px solid var(--line)',fontWeight:mio?700:400,fontSize:13}}>
            <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m[0]}</span>
            <input type="number" step="0.5" inputMode="decimal" value={r[0]} onChange={e=>set(0,e.target.value)} style={{width:64,padding:'6px',textAlign:'center'}}/>
            <input type="number" step="0.5" inputMode="decimal" value={r[1]} onChange={e=>set(1,e.target.value)} style={{width:64,padding:'6px',textAlign:'center'}}/>
            <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textAlign:'right'}}>{m[1]}</span>
          </div>;})}
      </div>
      {sfida&&<div className="card">
        <h2>{sfida.avv}</h2>
        <p className="hint">Chi può schierarti contro, per fantamedia.</p>
        {(squadre[sfida.avv]||[]).map(p=>valuta(p,turno,classifica))
          .sort((a,b)=>(b.fm||0)-(a.fm||0)).slice(0,12)
          .map(p=><Riga key={p.id} p={p} dx={<><b>{p.fm?p.fm.toFixed(2):'—'}</b><span>{p.pv} pres</span></>}/>)}
      </div>}
    </>}

    {vista==='dati'&&<>
      <div className="card">
        <h2>Statistiche</h2>
        <p className="hint">Scarica da Fantacalcio.it, Risorse → Statistiche, il pulsante Scarica.
          Poi carica qui il file dopo ogni giornata: i voti attesi si ricalcolano.</p>
        <label className="file btn alt" style={{marginTop:10}}>
          Carica il file .xlsx
          <input type="file" accept=".xlsx,.xls" onChange={e=>{const f=e.target.files[0];if(f)carica(f);e.target.value='';}}/>
        </label>
        <p className="hint">{stats?'Statistiche aggiornate dal tuo file.':'Al momento uso quelle caricate il 17/09/2026, dopo 4 giornate.'}</p>
      </div>
      <div className="card">
        <h2>Partite di Serie A</h2>
        <p className="hint">Una riga per partita, formato Casa-Trasferta. Aggiorna a ogni giornata.</p>
        <textarea rows="11" value={turnoTxt} onChange={e=>setTurnoTxt(e.target.value)}/>
      </div>
      <div className="card">
        <h2>Classifica</h2>
        <p className="hint">Dalla prima all'ultima, separate da virgola. Serve a pesare la difficoltà dell'avversario.</p>
        <textarea rows="4" value={classTxt} onChange={e=>setClassTxt(e.target.value)}/>
      </div>
      <div className="card">
        <h2>Modificatore di difesa</h2>
        <p className="hint">Le soglie della tua lega, sulla media voto di portiere e difensori schierati.</p>
        {MOD_SOGLIE.map(([s,v])=><div className="kv" key={s}><span>{s}</span><b className="num">{v}</b></div>)}
      </div>
    </>}

    {apri&&<div className="mask" onClick={()=>setApri(null)}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"/>
        <h2 style={{fontSize:15}}>Scegli un {apri.R==='P'?'portiere':apri.R==='D'?'difensore':apri.R==='C'?'centrocampista':'attaccante'}</h2>
        <p className="hint">In ordine di voto atteso. Chi è già in campo compare in fondo.</p>
        {rosa.filter(p=>p.ruolo===apri.R)
             .sort((a,b)=>(dentro.has(a.id)-dentro.has(b.id))||((b.voto??-9)-(a.voto??-9)))
             .map(p=><Riga key={p.id} p={p}
               onClick={()=>{
                 const k=apri.k!==null&&apri.k!==undefined?apri.k:
                   (schierati[apri.R].findIndex(x=>!x)>=0?schierati[apri.R].findIndex(x=>!x):schierati[apri.R].length-1);
                 metti(apri.R,k,p.id);}}
               dx={<><b>{p.voto?p.voto.toFixed(2):'—'}</b><span>{dentro.has(p.id)?'in campo':'panchina'}</span></>}/>)}
      </div>
    </div>}

    <nav className="nav">
      {[['campo','⚽','Campo'],['rosa','👥','Rosa'],['lega','🏆','Lega'],['dati','⚙︎','Dati']].map(([k,i,l])=>
        <button key={k} data-on={vista===k?'1':'0'} onClick={()=>setVista(k)}><b>{i}</b>{l}</button>)}
    </nav>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
